os","cc":"Em trabalho de parto, bolsa rota há 10 h","v":{"pa":"124/78","fc":104,"sat":99,"fr":20,"t":37.4},"d":[["lucia","Cefazolina já está aqui. Mais alguma coisa?"],["yara","Ela estava em trabalho de parto com bolsa rota."]],"q":[{"q":"Antibiótico profilático adicional à cefazolina:","o":["Azitromicina","Metronidazol","Gentamicina","Vancomicina"],"c":[120],"e":"Cesárea em trabalho de parto ou com bolsa rota: cefazolina + azitromicina 500 mg EV reduz endometrite e infecção de ferida (estudo C/SOAP).","m":["Cesárea com bolsa rota: a cefaZOLINA chega de mãos dadas com a AZITRO na porta da sala.",[["de mãos dadas","cefazolina + azitromicina se trabalho de parto ou bolsa rota"]]]},{"q":"As 4 indicações que somam > 80% das primeiras cesáreas:","o":["Falha de progressão, sofrimento fetal, mau posicionamento fetal e placentação anormal","Desejo materno, HIV, herpes e cesárea prévia","Pré-eclâmpsia, diabetes, gemelaridade e prematuridade","Idade materna, obesidade, miomas e infertilidade"],"c":[88],"e":"Primeira cesárea: falha de progressão (distocia), FCF não tranquilizadora, apresentação anômala e placenta prévia/acretismo.","m":["A primeira cesárea traz 4 P na prancheta.",[["Parou","falha de progressão"],["Passando mal","sofrimento fetal"],["Posição","mau posicionamento fetal"],["Placenta","placentação anormal"]]]}]},{"id":"co08","s":"co","t":"Sangrando com 9 semanas","p":"Duas gestantes no PA obstétrico","cc":"Sangramento da 1ª metade","v":{"pa":"110/70","fc":96,"sat":99,"fr":18,"t":36.7},"d":[["yara","Faz o toque e me diz qual é qual."]],"q":[{"q":"Leito 1: sangramento vermelho-vivo intenso, cólica forte, colo ABERTO, embrião ainda no útero:","o":["Abortamento inevitável","Ameaça de abortamento","Abortamento retido","Abortamento completo"],"c":[54],"e":"Inevitável: colo aberto com sangramento e dor intensos. Conduta: esvaziamento uterino.","m":["A porta do colo está ESCANCARADA, sai muito sangue e a cólica é forte: não tem mais volta.",[["porta escancarada","colo aberto = abortamento INEVITÁVEL"]]]},{"q":"Leito 2: sangramento discreto, dor leve, colo FECHADO, embrião com BCF:","o":["Ameaça de abortamento","Abortamento inevitável","Abortamento incompleto","Abortamento infectado"],"c":[234],"e":"Ameaça: sangramento discreto, colo fechado, embrião vivo. Conduta expectante e repouso relativo.","m":["A porta está FECHADA, sai um pouquinho de sangue e o coraçãozinho bate no ultrassom: é só alguém batendo na porta.",[["porta fechada + BCF","AMEAÇA de abortamento"]]]}]},{"id":"co09","s":"co","t":"Útero de pedra","p":"Cristina, 34 anos, 33 semanas","cc":"Dor abdominal súbita e sangramento escuro","v":{"pa":"168/104","fc":118,"sat":98,"fr":22,"t":36.8},"d":[["cida","Útero lenhoso, BCF 100."],["yara","Hipertensa, dor súbita, útero duro. Você sabe o que é."]],"q":[{"q":"Hipótese:","o":["Descolamento prematuro de placenta","Placenta prévia","Rotura de vasa prévia","Trabalho de parto prematuro simples"],"c":[235],"e":"DPP: dor súbita intensa, hipertonia, sangramento escuro (pode ser oculto), sofrimento fetal; HAS é o principal fator de risco. Placenta prévia: sangramento indolor, vermelho-vivo, útero relaxado.","x":"Você pediu USG e aguardou: BCF caiu para 60.","m":["A barriga vira PEDRA de repente, a mãe hipertensa grita de dor e sai sangue escuro como CAFÉ.",[["pedra + dor + café","descolamento prematuro de placenta"],["o oposto","placenta prévia: sangue vivo, sem dor, útero mole"]]]}]},{"id":"co10","s":"co","t":"Papel da CTG","p":"Ambulatório de vitalidade fetal","cc":"Cardiotocografia e perfil biofísico","v":{"pa":"118/76","fc":84,"sat":99,"fr":16,"t":36.5},"d":[["yara","Vamos ver se você lê traçado como gente grande."]],"q":[{"q":"Com o avanço da idade gestacional, a linha de base da FCF:","o":["Diminui gradualmente","Aumenta gradualmente","Não muda","Oscila sem padrão"],"c":[229],"e":"Maturação parassimpática: a linha de base cai ao longo da gestação (e a variabilidade e as acelerações aumentam).","m":["Um bebê que vai ficando mais velho fica mais calmo: a linha de base DESCE como quem sai da adolescência.",[["mais calmo","linha de base da FCF diminui com a IG"]]]},{"q":"E a quantidade de acelerações transitórias:","o":["Aumenta gradualmente","Diminui gradualmente","Some após 34 semanas","Não muda"],"c":[175],"e":"O feto mais maduro tem mais acelerações; por isso o critério de reatividade é menos exigente antes de 32 semanas.","m":["E fica mais animado nas brincadeiras.",[["mais animado","acelerações transitórias aumentam com a IG"]]]},{"q":"Indicações comuns de CTG anteparto:","o":["Risco elevado de sofrimento fetal, suspeita de restrição de crescimento e gestação de alto risco","Toda gestação de baixo risco a partir de 20 semanas","Só no trabalho de parto","Determinar o sexo fetal"],"c":[230],"e":"CTG anteparto avalia vitalidade em gestações com risco (RCF, HAS, DM, pós-datismo). Baixo risco sem intercorrência não precisa.","m":["A CTG anteparto é a câmera de segurança das gestações de RISCO. Gestação tranquila não precisa de câmera.",[["câmera de segurança","risco de sofrimento, suspeita de RCF, alto risco"]]]},{"q":"Perfil biofísico: qual parâmetro surge por último na gestação (e é o primeiro a sumir na hipóxia)?","o":["Reatividade da FCF (24–28 sem), depois de movimentos respiratórios (20–21 sem), movimentos corporais (9 sem) e tônus (7,5–8,5 sem)","Tônus fetal","Movimentos corporais","Movimentos respiratórios, que surgem com 11 semanas"],"c":[318],"e":"Hipóxia gradual (Vintzileos): o que amadurece por último some primeiro. Ordem de perda: FCF → respiração → movimentos → tônus. O card dizia 11 semanas para os movimentos respiratórios; para prova use 20–21.","m":["A fila do perfil biofísico: o TÔNUS chega primeiro, depois o MOVIMENTO, a RESPIRAÇÃO e, por último, a FCF reativa. Quando falta oxigênio, quem chegou por último é o primeiro a ir embora.",[["tônus","7,5–8,5 semanas"],["movimento","9 semanas"],["respiração","20–21 semanas"],["FCF reativa","24–28 semanas: primeira a sumir na hipóxia"] umor do seio endodérmico","Coriocarcinoma"],"c":[102],"e":"Benignos: teratomas maduros (cístico = dermoide; sólido) e struma ovarii (teratoma monodérmico com tecido tireoidiano).","m":["Um cisto com CABELO, DENTE e até uma TIREOIDE dentro: os benignos são os MADUROS.",[["cabelo e dente","cisto dermoide (teratoma cístico maduro)"],["tireoide","struma ovarii"],["maduros","teratoma maduro sólido"]]]}]},{"id":"co13","s":"co","t":"Endometrioma de 6 cm","p":"Priscila, 38 anos","cc":"Endometriose e massa ovariana complexa","v":{"pa":"118/74","fc":76,"sat":99,"fr":14,"t":36.6},"d":[["yara","Quero discutir o risco oncológico dela."]],"q":[{"q":"A endometriose eleva o risco de quais subtipos de câncer de ovário?","o":["Endometrioide e células claras","Seroso de alto grau e mucinoso","Disgerminoma e teratoma","Granulosa e Sertoli-Leydig"],"c":[240],"e":"Carcinomas associados à endometriose: endometrioide e de células claras.","m":["A endometriose é uma tinta que deixa o ovário 'endometrioide' e de vidro CLARO.",[["endometrioide + vidro claro","carcinomas endometrioide e de células claras"]]]},{"q":"Entre os epiteliais, qual a resposta clássica de \"pior prognóstico\"?","o":["Células claras","Seroso de baixo grau","Mucinoso estádio I","Endometrioide bem diferenciado"],"c":[142],"e":"Células claras é quimiorresistente e é a resposta de prova. Em números absolutos, o seroso de alto grau é o que mais mata.","m":["Uma janela de vidro CLARO que nem a quimioterapia consegue quebrar.",[["vidro inquebrável","células claras: pior prognóstico (quimiorresistente)"]]]},{"q":"Principal marcador tumoral do câncer epitelial de ovário:","o":["CA-125","CEA","AFP","β-hCG"],"c":[285],"e":"CA-125: elevado em ~80% dos epiteliais avançados; pode estar normal em estágio inicial e sobe em endometriose, gestação, DIP.","m":["O CA-125 é um fofoqueiro: avisa do câncer de ovário, mas também grita na endometriose, na gestação e na DIP.",[["fofoqueiro","CA-125: marcador do epitelial, inespecífico"]]]}]},{"i . O tapete de cima é só enfeite.",[["rede","diafragma pélvico: levantador do ânus + isquiococcígeo"],["tapete","bulboesponjoso, isquiocavernoso (períneo superficial)"]]]}]},{"id":"ped01","s":"ped","t":"Puericultura dos 4 meses","p":"Theo, 4 meses","cc":"Consulta de rotina","v":{"pa":"—","fc":132,"sat":99,"fr":36,"t":36.7},"d":[["bia","A mãe pergunta se ele está \"no tempo certo\". Responde com o Nelson na cabeça."]],"q":[{"q":"Desenvolvimento ADAPTATIVO esperado aos 4 meses:","o":["Agarrar o objeto e levar à boca","Transferir objetos de uma mão para a outra","Pinça polegar-indicador","Torre de 3 cubos"],"c":[9],"e":"4 meses: agarra e leva à boca. 7 meses: transfere. 12 meses: pinça. 15 meses: torre de 3 cubos.","m":["Theo, 4 meses, é um ASPIRADOR de pó: agarra tudo e enfia na boca.",[["aspirador","4 meses: agarra e leva à boca"]]]},{"q":"Desenvolvimento PESSOAL-SOCIAL esperado aos 4 meses:","o":["Gargalhadas","Estranhar desconhecidos","Brincar de bola","Apontar o que quer"],"c":[61],"e":"4 meses: ri alto (gargalhada). Estranhamento ~8 meses; bola ~12 meses; apontar ~15 meses.","m":["Aos 4 meses o bebê descobre a GARGALHADA: faça cócegas e ele explode de rir.",[["gargalhada","4 meses: pessoal-social"]]]}]},{"id":"ped02","s":"ped","t":"7 e 12 meses","p":"Gêmeas Alice e Clara","cc":"Puericultura","v":{"pa":"—","fc":124,"sat":99,"fr":32,"t":36.6},"d":[["bia","Uma com 7 meses, a outra é a prima de 12. Mesma consulta."]],"q":[{"q":"ADAPTATIVO aos 7 meses:","o":["Transferir objetos de uma mão para a outra","Levar objeto à boca pela primeira vez","Rabiscar com lápis","Torre de 3 cubos"],"c":[207],"e":"7 meses: alcança, agarra objetos grandes e transfere entre as mãos.","m":["Aos 7 meses o bebê vira MALABARISTA: passa a bolinha de uma mão para a outra.",[["malabarista","7 meses: transfere objetos"]]]},{"q":"PESSOAL-SOCIAL aos 12 meses:","o":["Brincar com bola (jogo simples)","Gargalhar pela primeira vez","Abraçar os pais e apontar desejos","Vestir-se sozinha"],"c":[105],"e": function pressure(i){ const c = CARDS[i], p = cp(i); return c.l * (won(i) ? 0.12 : 1) * (1 + 0.5 * (p.err || 0)); }
function caseWeight(cs){ let w = 0; cs.q.forEach(q => q.c.forEach(i => w += pressure(i))); return w / Math.sqrt(cs.q.length); }
function weightedPick(pool, n, perSector){
  pool = pool.slice(); const out = []; const count = {};
  while (out.length < n && pool.length){
    const ws = pool.map(c => (perSector && (count[c.s] || 0) >= perSector) ? 0 : caseWeight(c));
    let tot = ws.reduce((a, b) => a + b, 0);
    if (tot <= 0) break;
    let r = Math.random() * tot, k = 0;
    while (r > ws[k]) { r -= ws[k]; k++; }
    const c = pool.splice(k, 1)[0]; out.push(c); count[c.s] = (count[c.s] || 0) + 1;
  }
  return out;
}

function hurt(){ const v = S.vit; v.fc = v.fc >= 60 ? Math.min(v.fc + 14, 190) : Math.max(v.fc - 8, 30); v.sat = Math.max(v.sat - 4, 70); v.fr = Math.min(v.fr + 4, 44); if (v.sys){ v.sys = Math.max(v.sys - 14, 55); v.dia = Math.max(v.dia - 8, 30); } }
function heal(){ const v = S.vit, f = 0.45; const to = (a, b) => Math.round(a + (b - a) * f);
  v.fc = to(v.fc, v.fc > 100 && v.fr > 30 ? 120 : NORMAL.fc); v.sat = Math.min(99, to(v.sat, NORMAL.sat)); v.fr = to(v.fr, NORMAL.fr);
  if (v.sys){ v.sys = to(v.sys, NORMAL.sys); v.dia = to(v.dia, NORMAL.dia); } }

/* ---------- backup do progresso ---------- */
const BK_PREFIX = 'PSANG1.';
function encodeBackup(){
  const c = {};
  Object.entries(P.cards || {}).forEach(([i, p]) => { if (p) c[i] = [p.ok || 0, p.err || 0, p.st || 0, Math.round((p.t || 0) / 1000)]; });
  const bytes = new TextEncoder().encode(JSON.stringify({n:P.name || '', s:P.shifts || 0, c}));
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return BK_PREFIX + btoa(bin);
}
function decodeBackup(str){
  str = String(str || '').replace(/\s+/g, '');
  const at = str.indexOf(BK_PREFIX);
  if (at < 0) throw new Error('prefix');
  const bin = atob(str.slice(at + BK_PREFIX.length));
  const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
  if (!o || typeof o.c !== 'object' || o.c === null) throw new Error('shape');
  const cards = {};
  Object.entries(o.c).forEach(([i, a]) => {
    const k = Number(i);
    if (!Number.isInteger(k) || !CARDS[k] || !Array.isArray(a)) return;
    cards[k] = {ok:Math.max(0, +a[0] || 0), err:Math.max(0, +a[1] || 0), st:Math.max(0, +a[2] || 0), t:(+a[3] || 0) * 1000};
  });
  return {name: typeof o.n === 'string' ? o.n.slice(0, 28) : '', shifts: Math.max(0, +o.s || 0), cards};
}
function importBackup(text, msgEl){
  let inc;
  try { inc = decodeBackup(text); }
  catch(e){ msgEl.className = 'msg bad'; msgEl.textContent = 'Esse código não é um backup do Plantão Sanguessuga. Copie o código inteiro, começando por PSANG1.'; return; }
  let changed = 0;
  Object.entries(inc.cards).forEach(([i, y]) => { const x = (P.cards || {})[i]; if (!x || (y.t || 0) > (x.t || 0)) changed++; });
  P = mergeP(P, inc); saveP();
  const total = Object.keys(inc.cards).length;
  renderHome();
  const box = document.getElementById('backupBox'); if (box) box.open = true;
  const m = document.getElementById('bkInMsg');
  if (m){ m.className = 'msg ok'; m.textContent = `Backup importado: ${total} cards no arquivo, ${changed} atualizados aqui.`; }
}
function wireBackup(){
  const out = document.getElementById('bkOut'), outMsg = document.getElementById('bkOutMsg');
  document.getElementById('bkCopy').addEventListener('click', () => {
    const code = encodeBackup();
    out.value = code; out.hidden = false;
    const done = () => { outMsg.className = 'msg ok'; outMsg.textContent = 'Código copiado. Cole no outro aparelho, em "Importar".'; };
    const manual = () => { out.focus(); out.select(); outMsg.className = 'msg'; outMsg.textContent = 'Não consegui copiar sozinho: o código está selecionado acima, copie manualmente.'; };
    try { navigator.clipboard.writeText(code).then(done, manual); } catch(e){ manual(); }
  });
  out.addEventListener('focus', () => out.select());
  document.getElementById('bkSave').addEventListener('click', async () => {
    const code = encodeBackup();
    const d = new Date(); const pad = n => String(n).padStart(2, '0');
    const filename = `plantao-sanguessuga-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.txt`;
    if (window.claude && window.claude.use){
      const dl = await window.claude.use('downloads');
      if (dl){
        try { await dl.save({filename, data:code}); outMsg.className = 'msg ok'; outMsg.textContent = 'Arquivo de backup salvo.'; }
        catch(e){ if (e && e.code === 'declined') { outMsg.className = 'msg'; outMsg.textContent = 'Download cancelado.'; } else { out.value = code; out.hidden = false; outMsg.className = 'msg'; outMsg.textContent = 'Não deu para baixar aqui. Use "Copiar código de backup".'; } }
        return;
      }
      out.value = code; out.hidden = false; outMsg.className = 'msg'; outMsg.textContent = 'Download indisponível nesta visualização. Use "Copiar código de backup".';
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([code], {type:'text/plain'})); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    outMsg.className = 'msg ok'; outMsg.textContent = 'Arquivo de backup baixado.';
  });
  document.getElementById('bkImport').addEventListener('click', () => importBackup(document.getElementById('bkIn').value, document.getElementById('bkInMsg')));
  document.getElementById('bkFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => importBackup(String(r.result || ''), document.getElementById('bkInMsg'));
    r.onerror = () => { const m = document.getElementById('bkInMsg'); m.className = 'msg bad'; m.textContent = 'Não consegui ler esse arquivo.'; };
    r.readAsText(f);
  });
}

/* ---------- ECG ---------- */
let ecgRaf = null;
function startECG(){
  cancelAnimationFrame(ecgRaf);
  const cv = document.getElementById('ecg'); if (!cv || !S) return;
  const ctx = cv.getContext('2d'); const W = cv.width, H = cv.height;
  const col = getComputedStyle(document.documentElement).getPropertyValue('--hr').trim() || '#3ddc84';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const beat = x => { // x em [0,1)
    if (x < .10) return 0; if (x < .16) return -Math.sin((x-.10)/.06*Math.PI)*.12;
    if (x < .22) return 0; if (x < .24) return .15; if (x < .27) return -1; if (x < .30) return .35;
    if (x < .40) return 0; if (x < .52) return -Math.sin((x-.40)/.12*Math.PI)*.22; return 0; };
  let off = 0, last = performance.now();
  const draw = now => {
    const v = S && S.vit; if (!v || !document.getElementById('ecg')) return;
    const dt = Math.min(64, now - last); last = now;
    const period = W * 60 / Math.max(30, v.fc) / 1.6;
    off = (off + dt * 0.12) % (period * 1000);
    ctx.clearRect(0,0,W,H); ctx.lineWidth = 2.2; ctx.strokeStyle = col; ctx.beginPath();
    for (let x = 0; x <= W; x += 2){ const ph = (((x + off) % period) + period) % period / period; const y = H*.58 + beat(ph) * H*.46; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    if (!reduce) ecgRaf = requestAnimationFrame(draw);
  };
  ecgRaf = requestAnimationFrame(draw);
}

      <div class="tile"><span class="eyebrow">Condutas certas</span><span class="big tabnum">${ok}/${total}</span></div>
      <div class="tile"><span class="eyebrow">Arrancadas hoje</span><span class="big tabnum">${S.won.length}</span></div>
      <div class="tile"><span class="eyebrow">Pontos</span><span class="big tabnum">${S.score}</span></div>
      <div class="tile"><span class="eyebrow">Cafés restantes</span><span class="big tabnum">${Math.max(0,S.lives)}</span></div>
    </div>
    <div class="row-btns">
      ${wrongIds.length ? `<button class="btn primary" id="retry" type="button">Repetir os ${wrongIds.length} cards errados</button>` : ''}
      <button class="btn ${wrongIds.length ? '' : 'primary'}" id="again" type="button">Novo plantão</button>
      <button class="btn ghost" data-go2="map" type="button">Ver o mapa</button>
    </div>
    ${wrongIds.length ? `<div class="review"><p class="eyebrow">Para revisar antes de dormir</p>${wrongIds.map(i => srcBlock(i, false, true)).join('')}</div>` : ''}
  </section>`;
  const again = document.getElementById('again'); again.addEventListener('click', () => S.mode === 'sector' ? startShift('sector', S.arg) : startShift('mixed'));
  const retry = document.getElementById('retry');
  if (retry) retry.addEventListener('click', () => { const ids = [...new Set(wrongIds.flatMap(i => CARDS[i].k))]; startShift('focus', ids.slice(0, 10)); });
  document.querySelectorAll('[data-go2]').forEach(b => b.addEventListener('click', () => go(b.dataset.go2)));
}

function renderMap(){
  const counts = {
    all: CARDS.length, game: INCLUDED.length, out: CARDS.filter(c => c.x).length,
    fix: CARDS.filter(c => c.s === 'fix').length, nuance: CARDS.filter(c => c.s === 'nuance').length,
    won: INCLUDED.filter(c => won(c.i)).length
  };
  const F = [['game','No jogo'],['all','Todas'],['fix','Corrigidos'],['nuance','Com ressalva'],['out','Fora da prova'],['won','Arrancadas']];
  document.getElementById('view').innerHTML = `
  <section class="mapv">
    <p class="eyebrow">Lapses ≥ 9 no seu deck</p>
    <h2>Mapa das sanguessugas</h2>
    <p class="muted" style="max-width:62ch">Todos os ${counts.all} cards com mais de 8 erros, do mais errado ao menos errado. Toque num card para ver a resposta, o carimbo do double-check e treinar só ele.</p>
    <div class="filters" role="group" aria-label="Filtro">${F.map(([k, l]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${mapState.filter===k}">${l} <span class="tabnum muted">${counts[k]}</span></button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="Buscar por palavra (ex.: glaucoma, sífilis, Forrest)" value="${esc(mapState.q)}" autocomplete="off">
    <div class="list" id="list"></div>
  </section>`;
  document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { mapState.filter = b.dataset.f; mapState.open = null; renderMap(); }));
  const qi = document.getElementById('q');
  qi.addEventListener('input', () => { mapState.q = qi.value; drawList(); });
  drawList();
}
function norm(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function drawList(){
  const f = mapState.filter, q = norm(mapState.q.trim());
  let rows = CARDS.filter(c => f === 'all' ? true : f === 'game' ? !c.x : f === 'out' ? !!c.x : f === 'won' ? (!c.x && won(c.i)) : c.s === f);
  if (q) rows = rows.filter(c => norm(c.f + ' ' + c.b + ' ' + c.d + ' ' + c.a).includes(q));
  rows.sort((a, b) => b.l - a.l || a.i - b.i);
  const list = document.getElementById('list');
  if (!rows.length){ list.innerHTML = '<p class="muted">Nenhum card com esse filtro.</p>'; return; }
  list.innerHTML = rows.map(c => {
    const st = c.x ? '' : won(c.i) ? '<span class="dot won" title="Arrancada"></span>' : half(c.i) ? '<span class="dot half" title="Afrouxando"></span>' : '<span class="dot" title="Grudada"></span>';
    const open = mapState.open === c.i;
    return `<div><button class="row" type="button" data-i="${c.i}" aria-expanded="${open}">
        <span class="lap tabnum">${c.l}<small>×</small></span>
        <span class="row-main"><span class="row-area">${esc(c.a)}</span><span class="row-front">${fmt(c.f)}</span></span>
        <span class="row-tags">${stampFor(c)}${st}</span>
      </button>
      ${open ? `<div class="detail">
        <p class="deck">${esc(c.d)}</p>
        <p class="src-b">${fmt(c.b)}</p>
        ${c.x ? `<p class="note" style="border-left-color:var(--gray)"><b>Fora do jogo</b>${esc(c.x)}</p>` : (c.n && c.s !== 'ok' ? `<p class="note ${c.s==='fix'?'fix':''}"><b>${c.s==='fix'?'Correção':'Ressalva'}</b>${esc(c.n)}</p>` : '')}
        ${!c.x && CARD_M[c.i] ? CARD_M[c.i].map(x => palaceHTML(x.m, x.s)).join('') : ''}
        ${c.x ? '' : `${progLine(c.i)}<div class="row-btns"><button class="btn primary" type="button" data-train="${c.i}">Treinar este card</button></div>`}
      </div>` : ''}</div>`;
  }).join('');
  list.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; mapState.open = mapState.open === i ? null : i; drawList(); }));
  list.querySelectorAll('[data-train]').forEach(b => b.addEventListener('click', () => startShift('focus', CARDS[+b.dataset.train].k)));
}

function renderReport(){
  const fix = CARDS.filter(c => c.s === 'fix').sort((a,b) => b.l - a.l);
  const nu = CARDS.filter(c => c.s === 'nuance').sort((a,b) => b.l - a.l);
  const ok = INCLUDED.length - fix.length - nu.length;
  const item = c => `<div class="src"><div class="src-top"><span class="leech">${DROP}errado ${c.l}×</span>${stampFor(c)}<span class="deck">${esc(c.a)}</span></div>
    <p class="src-f">${fmt(c.f)}</p><p class="src-b"><span class="eyebrow">Seu card dizia:</span> ${fmt(c.b)}</p>
    <p class="note ${c.s==='fix'?'fix':''}"><b>${c.s==='fix'?'Correção':'Ressalva'}</b>${esc(c.n)}</p></div>`;
  document.getElementById('view').innerHTML = `
  <section class="reportv">

      <div class="tile"><span class="eyebrow">Conferem</span><span class="big tabnum" style="color:var(--ok)">${ok}</span></div>
      <div class="tile"><span class="eyebrow">Com ressalva</span><span class="big tabnum" style="color:var(--amber)">${nu.length}</span></div>

    <div class="review">${nu.map(item).join('')}</div>
    <h3 class="group-title">Fontes consultadas</h3>

  </section>`;

/* ---------- sincronização na conta: o mesmo progresso no celular e no computador ---------- */
const SYNC = {ref:null, state:'local', timer:null, busy:false, dirty:false, lastPull:0, retries:0};
function mergeP(a, b){
  const out = {name: a.name || b.name || '', shifts: Math.max(a.shifts || 0, b.shifts || 0), cards: {}};
  const ac = a.cards || {}, bc = b.cards || {};
  new Set([...Object.keys(ac), ...Object.keys(bc)]).forEach(id => {
    const x = ac[id], y = bc[id];
    out.cards[id] = !x ? y : !y ? x : ((y.t || 0) > (x.t || 0) ? y : x);
  });
  return out;
}
function syncLabel(){ return SYNC.state === 'cloud' ? 'sincronizado na sua conta' : 'salvo neste aparelho'; }
function refreshSyncBadge(){ const b = document.getElementById('syncBadge'); if (b) b.textContent = syncLabel(); }
function scheduleSync(){
  if (!SYNC.ref) return;
  SYNC.dirty = true; clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(pushSync, 1500);
}
async function pushSync(){
  if (!SYNC.ref || SYNC.busy) return;
  SYNC.busy = true; SYNC.dirty = false;
  try {
    await SYNC.ref.set({name:P.name || '', shifts:P.shifts || 0, cards:P.cards, updated:Date.now()});
    SYNC.state = 'cloud';
  } catch(e){
    const code = e && e.code;
    if (code === 'unavailable') SYNC.dirty = true;
    else { SYNC.ref = null; SYNC.state = 'local'; }
  } finally {
    SYNC.busy = false; refreshSyncBadge();
    if (SYNC.dirty && SYNC.ref){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(pushSync, 2500 + Math.random() * 1500); }
  }
}
async function pullSync(){
  if (!SYNC.ref) return;
  SYNC.lastPull = Date.now();
  let snap;
  try { snap = await SYNC.ref.get(); }
  catch(e){
    if (e && e.code === 'unavailable' && SYNC.retries++ < 2) setTimeout(pullSync, 1500 + Math.random() * 1500);
    else if (!(e && e.code === 'unavailable')) SYNC.ref = null;
    return;
  }
  const remote = snap.exists ? snap.data() : null;
  const before = JSON.stringify(P);
  if (remote && remote.cards) P = mergeP(P, remote);
  saveLocal();
  SYNC.state = 'cloud';
  const remoteStr = remote ? JSON.stringify({name:remote.name || '', shifts:remote.shifts || 0, cards:remote.cards || {}}) : '';
  const mine = JSON.stringify({name:P.name || '', shifts:P.shifts || 0, cards:P.cards});
  if (mine !== remoteStr) scheduleSync();
  if (view !== 'shift' && JSON.stringify(P) !== before) render(); else refreshSyncBadge();
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    SYNC.ref = db.doc('data/users/' + uid + '/progress');
    await pullSync();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden'){ if (SYNC.dirty){ clearTimeout(SYNC.timer); pushSync(); } }
      else if (Date.now() - SYNC.lastPull > 20000) pullSync();
    });
  } catch(e){}
})();

/* ---------- boot ---------- */
function start(saved){
  try {
    if (saved && saved.S && saved.S.queue && saved.S.queue.every(id => CASE_BY_ID[id])) { S = saved.S; }
    if (saved && saved.view) view = saved.view === 'shift' && !S ? 'home' : saved.view;
    if (saved && saved.mapState) mapState = saved.mapState;
  } catch(e){}
  const h = (location.hash || '').replace('#','');
  if (!saved || !saved.view){ if (h === 'mapa') view = 'map'; else if (h === 'double-check') view = 'report'; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({view, S, mapState}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
