<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Plantão Sanguessuga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: uma folha de prontuário em coluna única; setores sinalizados como placas de hospital; monitor multiparamétrico como único bloco escuro fixo. */
:root{
  --paper:#eef1ee; --sheet:#ffffff; --sheet-2:#f6f8f6; --ink:#14201e; --ink-2:#4b5a57; --rule:#d3dbd7;
  --teal:#0d6b63; --teal-soft:#d9ece9; --blood:#b0281f; --blood-soft:#f7e1de; --amber:#8f5600; --amber-soft:#f6ead3;
  --ok:#1d7438; --ok-soft:#dcefe1; --gray:#6b7774;
  --s-ps:#c3352b; --s-cc:#2459a6; --s-co:#8b3a7e; --s-ped:#a8680a; --s-uti:#0d6b63; --s-amb:#3d7a2b; --on-s:#ffffff;
  --screen:#06100e; --screen-rule:#17302b; --hr:#3ddc84; --spo2:#4cc9f0; --nibp:#eef4f2; --rr:#f4d35e; --tmp:#f39a6b; --alarm:#ff4d4d;
  --f-display:"Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --shadow:0 1px 0 rgba(20,32,30,.06), 0 8px 24px -16px rgba(20,32,30,.35);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0b1312; --sheet:#121c1a; --sheet-2:#172321; --ink:#e3ebe8; --ink-2:#97a8a4; --rule:#263532;
  --teal:#4dbdb0; --teal-soft:#16302c; --blood:#ff7b6c; --blood-soft:#3a1c19; --amber:#f0b24e; --amber-soft:#33281a;
  --ok:#6fd08c; --ok-soft:#173022; --gray:#8d9a97;
  --s-ps:#e5594e; --s-cc:#6596e3; --s-co:#c46fb6; --s-ped:#e2a23b; --s-uti:#45b5a8; --s-amb:#77b55e; --on-s:#0b1312;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0b1312; --sheet:#121c1a; --sheet-2:#172321; --ink:#e3ebe8; --ink-2:#97a8a4; --rule:#263532;
  --teal:#4dbdb0; --teal-soft:#16302c; --blood:#ff7b6c; --blood-soft:#3a1c19; --amber:#f0b24e; --amber-soft:#33281a;
  --ok:#6fd08c; --ok-soft:#173022; --gray:#8d9a97;
  --s-ps:#e5594e; --s-cc:#6596e3; --s-co:#c46fb6; --s-ped:#e2a23b; --s-uti:#45b5a8; --s-amb:#77b55e; --on-s:#0b1312;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
.app{max-width:860px; margin:0 auto; padding-inline:16px; padding-block:0 64px}
button{font:inherit; color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal); outline-offset:2px; border-radius:6px}
h1,h2,h3{text-wrap:balance; margin:0}
p{margin:0}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2)}
.muted{color:var(--ink-2)}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--rule); margin-inline:-16px; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{font-family:var(--f-display); font-stretch:75%; font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:18px; display:flex; align-items:center; gap:8px; background:none; border:0; padding:0; cursor:pointer}
.brand svg{width:16px; height:20px; color:var(--blood)}
.nav{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
.nav button{background:none; border:1px solid transparent; border-radius:999px; padding:5px 12px; cursor:pointer; color:var(--ink-2); font-size:14px}
.nav button[aria-current="page"]{border-color:var(--rule); background:var(--sheet); color:var(--ink)}
.nav button:hover{color:var(--ink)}
.hud{display:flex; align-items:center; gap:14px; font-family:var(--f-mono); font-size:13px}
.cups{display:flex; gap:3px}
.cups svg{width:18px; height:18px}
.cup-full{color:var(--amber)} .cup-empty{color:var(--rule)}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:8px; padding:11px 18px; border:1px solid var(--rule); background:var(--sheet); cursor:pointer; font-weight:700; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--teal); border-color:var(--teal); color:var(--sheet)}
:root:not([data-theme="light"]) .btn.primary{color:var(--paper)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.row-btns{display:flex; flex-wrap:wrap; gap:10px}

/* ---------- home ---------- */
.hero{padding-block:36px 8px; display:grid; gap:14px}
.hero h1{font-family:var(--f-display); font-stretch:68%; font-weight:900; text-transform:uppercase; font-size:clamp(46px, 11vw, 92px); line-height:.86; letter-spacing:-.01em}
.hero h1 .drop{color:var(--blood)}
.hero .lede{font-size:18px; max-width:58ch; color:var(--ink-2)}
.hero .lede strong{color:var(--ink)}
.badge-form{display:flex; flex-wrap:wrap; align-items:end; gap:12px; margin-top:6px}
.cracha{display:grid; gap:4px; background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:10px 14px 12px; box-shadow:var(--shadow); position:relative; min-width:0}
.cracha::before{content:""; position:absolute; top:7px; left:50%; width:28px; height:5px; margin-left:-14px; border-radius:3px; background:var(--paper); border:1px solid var(--rule)}
.cracha label{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-top:8px}
.cracha input{font:inherit; font-weight:700; font-size:18px; border:0; border-bottom:1px dashed var(--rule); background:transparent; color:var(--ink); padding:2px 0; width:min(240px, 60vw)}
.cracha input:focus{outline:none; border-bottom-color:var(--teal)}
.progress-card{margin-top:22px; background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:16px 18px; display:grid; gap:10px}
.progress-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.big{font-family:var(--f-display); font-stretch:75%; font-weight:800; font-size:40px; line-height:1}
.bar{height:10px; border-radius:6px; background:var(--sheet-2); border:1px solid var(--rule); overflow:hidden; display:flex}
.bar span{display:block; height:100%}
.bar .b-def{background:var(--ok)} .bar .b-half{background:var(--amber)}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--ink-2)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}

.signs{margin-top:28px; display:grid; gap:6px}
.signs-title{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:8px; flex-wrap:wrap}
.sign{display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:14px; text-align:left; width:100%; border:0; border-radius:8px; padding:0; background:var(--sheet); cursor:pointer; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--rule)}
.sign:hover .sign-arrow{transform:translateX(4px)}
.sign-code{align-self:stretch; display:grid; place-items:center; background:var(--sc); color:var(--on-s); font-family:var(--f-display); font-stretch:75%; font-weight:900; font-size:20px; letter-spacing:.02em; min-height:64px}
.sign-main{padding-block:10px; min-width:0}
.sign-name{font-family:var(--f-display); font-stretch:85%; font-weight:800; text-transform:uppercase; font-size:18px; letter-spacing:.01em}
.sign-sub{font-size:14px; color:var(--ink-2)}
.sign-meta{padding-right:16px; display:flex; align-items:center; gap:12px; font-family:var(--f-mono); font-size:12px; color:var(--ink-2); text-align:right}
.sign-arrow{font-size:22px; color:var(--ink); transition:transform .15s}
.howto{margin-top:28px; display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px}
.howto div{border-top:2px solid var(--ink); padding-top:8px; font-size:14px; color:var(--ink-2)}
.howto strong{display:block; color:var(--ink); font-size:15px}
.backup{margin-top:28px; background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:0}
.backup summary{cursor:pointer; padding:14px 18px; font-family:var(--f-display); font-stretch:85%; font-weight:800; text-transform:uppercase; font-size:17px; list-style:none; display:flex; justify-content:space-between; gap:12px; align-items:center}
.backup summary::-webkit-details-marker{display:none}
.backup summary::after{content:"+"; font-family:var(--f-mono); font-size:20px; color:var(--ink-2)}
.backup[open] summary::after{content:"−"}
.backup-body{padding:0 18px 18px; display:grid; gap:18px}
.backup-step{display:grid; gap:8px}
.backup-step h3{font-size:16px}
.backup textarea{font-family:var(--f-mono); font-size:12px; width:100%; min-height:84px; resize:vertical; padding:10px; border:1px solid var(--rule); border-radius:8px; background:var(--sheet-2); color:var(--ink); overflow-wrap:anywhere}
.backup .msg{font-size:14px; min-height:1.2em}
.backup .msg.ok{color:var(--ok)} .backup .msg.bad{color:var(--blood)}
.filebtn{position:relative; overflow:hidden}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}

/* ---------- shift ---------- */
.shift{padding-top:18px; display:grid; gap:14px}
.shift-top{display:flex; justify-content:space-between; align-items:center; gap:10px 16px; flex-wrap:wrap}
.trail{display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.trail i{width:22px; height:6px; border-radius:3px; background:var(--rule); display:block}
.trail i.done-ok{background:var(--ok)} .trail i.done-bad{background:var(--blood)} .trail i.now{background:var(--ink)}
.case{background:var(--sheet); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
.case-head{display:flex; gap:14px; align-items:stretch; border-bottom:1px solid var(--rule)}
.case-head .sign-code{min-width:64px; font-size:18px}
.case-head .ch-text{padding:12px 16px 12px 0; display:grid; gap:2px; min-width:0}
.case-head h2{font-family:var(--f-display); font-stretch:80%; font-weight:800; font-size:26px; line-height:1.05}
.case-body{padding:16px; display:grid; gap:16px}
.patient{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:14px; align-items:stretch}
.pt{display:grid; gap:8px; align-content:start; min-width:0}
.pt-name{font-weight:700; font-size:18px}
.pt-cc{color:var(--ink-2)}
.wrist{display:flex; align-items:center; gap:10px; border:1px solid var(--rule); border-radius:999px; padding:4px 12px 4px 4px; font-family:var(--f-mono); font-size:11px; color:var(--ink-2); background:var(--sheet-2); width:max-content; max-width:100%}
.wrist b{display:block; width:42px; height:18px; border-radius:999px; background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px); opacity:.75}
.monitor{background:var(--screen); border-radius:10px; padding:10px 12px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:4px 10px; border:2px solid var(--screen-rule); position:relative; color:var(--nibp)}
.monitor canvas{grid-column:1 / -1; width:100%; height:46px; display:block}
.vit{display:grid; font-family:var(--f-mono); line-height:1.1}
.vit .lab{font-size:10px; letter-spacing:.08em; opacity:.8}
.vit .val{font-size:24px; font-weight:600; font-variant-numeric:tabular-nums}
.vit.hr{color:var(--hr)} .vit.spo2{color:var(--spo2)} .vit.nibp{color:var(--nibp)} .vit.rr{color:var(--rr)} .vit.tmp{color:var(--tmp)}
.vit.nibp .val{font-size:20px}
.monitor .alarm-tag{position:absolute; top:8px; right:10px; font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; color:var(--alarm); display:none}
.monitor.alarm{border-color:var(--alarm); animation:alarm 1s steps(2) infinite}
.monitor.alarm .alarm-tag{display:block}
@keyframes alarm{50%{border-color:var(--screen-rule)}}
.dialogue{display:grid; gap:10px}
.line{display:grid; grid-template-columns:36px 1fr; gap:10px; align-items:start}
.avatar{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-display); font-stretch:75%; font-weight:800; font-size:14px; background:var(--ac, var(--gray)); color:var(--on-s)}
.line .who{font-size:13px; font-weight:700}
.line .who span{font-weight:400; color:var(--ink-2)}
.line .say{background:var(--sheet-2); border:1px solid var(--rule); border-radius:4px 12px 12px 12px; padding:8px 12px; max-width:62ch}
.q{border-top:1px dashed var(--rule); padding-top:16px; display:grid; gap:12px}
.q h3{font-size:19px; line-height:1.35; font-weight:700}
.opts{display:grid; gap:8px}
.opt{display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:start; text-align:left; width:100%; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:11px 12px; cursor:pointer; line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--teal); background:var(--teal-soft)}
.opt .k{font-family:var(--f-mono); font-weight:600; font-size:13px; width:24px; height:24px; border-radius:6px; border:1px solid var(--rule); display:grid; place-items:center; color:var(--ink-2)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); border-color:var(--ok); color:var(--sheet)}
.opt.wrong{border-color:var(--blood); background:var(--blood-soft)}
.opt.wrong .k{background:var(--blood); border-color:var(--blood); color:var(--sheet)}
.opt.dim{opacity:.55}
.feedback{display:grid; gap:12px}
.verdict{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; border-radius:8px; padding:10px 12px; border:1px solid}
.verdict.ok{background:var(--ok-soft); border-color:var(--ok)}
.verdict.bad{background:var(--blood-soft); border-color:var(--blood)}
.verdict strong{font-family:var(--f-display); font-stretch:80%; text-transform:uppercase; font-weight:800; letter-spacing:.02em; white-space:nowrap}
.verdict.ok strong{color:var(--ok)} .verdict.bad strong{color:var(--blood)}
.explain{font-size:16px; max-width:68ch}
.origin{display:grid; gap:8px}
.src{border:1px solid var(--rule); border-radius:8px; padding:12px; background:var(--sheet-2); display:grid; gap:8px; min-width:0}
.src-top{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center}
.leech{display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-weight:600; color:var(--blood); font-size:13px; white-space:nowrap}
.leech svg{width:11px; height:14px}
.deck{font-size:12px; color:var(--ink-2); min-width:0; overflow-wrap:anywhere}
.src-f{font-weight:700}
.src-b{color:var(--ink-2); font-size:15px; overflow-wrap:anywhere}
mark{background:var(--amber-soft); color:var(--ink); padding:0 3px; border-radius:3px; font-weight:700}
.note{border-left:3px solid var(--amber); padding-left:10px; font-size:15px}
.note.fix{border-left-color:var(--blood)}
.palace{border-left:4px solid var(--sc, var(--teal)); background:var(--sheet-2); border-radius:0 8px 8px 0; padding:10px 12px; display:grid; gap:4px; max-width:72ch}
.palace .hook-scene{font-size:17px; line-height:1.45; font-style:italic}
.hook-key{list-style:none; margin:4px 0 0; padding:8px 0 0; border-top:1px dashed var(--rule); display:grid; gap:3px; font-size:14px; color:var(--ink-2)}
.hook-key b{color:var(--ink); font-weight:700}
.palace .eyebrow{display:flex; align-items:center; gap:6px}
.palace .eyebrow svg{width:13px; height:13px; flex:none}
.note b{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; display:block; color:var(--ink-2)}
.prog{font-family:var(--f-mono); font-size:12px; color:var(--ink-2)}
.prog.won{color:var(--ok); font-weight:600}
.stamp{display:inline-block; font-family:var(--f-display); font-stretch:75%; font-weight:900; font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px 1px; border:2px solid currentColor; border-radius:4px; transform:rotate(-2.5deg); box-shadow:inset 0 0 0 1px currentColor; line-height:1.3; white-space:nowrap}
.stamp.ok{color:var(--ok)} .stamp.nuance{color:var(--amber)} .stamp.fix{color:var(--blood)} .stamp.out{color:var(--gray)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* ---------- end ---------- */
.endv{padding-top:28px; display:grid; gap:18px}
.endv h2{font-family:var(--f-display); font-stretch:70%; font-weight:900; text-transform:uppercase; font-size:clamp(40px, 9vw, 64px); line-height:.9}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px}
.tile{background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:12px 14px; display:grid; gap:4px}
.review{display:grid; gap:8px}

/* ---------- map ---------- */
.mapv{padding-top:24px; display:grid; gap:14px}
.mapv h2, .reportv h2{font-family:var(--f-display); font-stretch:72%; font-weight:900; text-transform:uppercase; font-size:clamp(34px, 8vw, 54px); line-height:.92}
.filters{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--rule); background:var(--sheet); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.search{font:inherit; width:100%; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; background:var(--sheet); color:var(--ink)}
.list{display:grid; gap:6px}
.row{display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:10px 12px; cursor:pointer}
.row:hover{border-color:var(--ink-2)}
.row .lap{font-family:var(--f-display); font-stretch:75%; font-weight:900; font-size:26px; color:var(--blood); line-height:1; display:flex; align-items:baseline; gap:2px}
.row .lap small{font-family:var(--f-mono); font-size:11px; font-weight:400; color:var(--ink-2)}
.row-main{display:grid; gap:2px; min-width:0}
.row-area{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
.row-front{overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.row-tags{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--rule)}
.dot.won{background:var(--ok)} .dot.half{background:var(--amber)}
.detail{background:var(--sheet-2); border:1px solid var(--rule); border-top:0; border-radius:0 0 8px 8px; margin-top:-8px; padding:14px 12px 12px; display:grid; gap:10px}

/* ---------- report ---------- */
.reportv{padding-top:24px; display:grid; gap:16px}
.sources{display:grid; gap:4px; font-size:14px; padding-left:18px; margin:0}
.group-title{font-family:var(--f-display); font-stretch:80%; font-weight:800; text-transform:uppercase; font-size:20px; margin-top:8px}

@media (max-width:620px){
  .patient{grid-template-columns:1fr}
  .sign{grid-template-columns:52px 1fr auto}
  .sign-meta .cnt{display:none}
  .case-head h2{font-size:22px}
  .row{grid-template-columns:46px minmax(0,1fr)}
  .row-tags{grid-column:2; flex-direction:row; align-items:center; justify-content:flex-start}
  .topbar{position:static}
  .nav button{padding:4px 9px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>

":11,"d":"Osler › Clínica Cirúrgica › Cirurgia Pediátrica › Abdome Agudo Pediátrico › Enterocolite Necrosante Neonatal","a":"Pediatria","f":"Enterocolite necrosante. Qual o principal esquema de antibiótico?","b":"Enterocolite necrosante. Qual o principal esquema de antibiótico? Ampicilina + Gentamicina + Metronidazol. Vamos lá: RN sempre recebe ampi + genta, é o clássico. E, se queremos cobrir aneróbios do cólon, tem que ter metronidazol. É um card bem específico, mas a resposta é bem fácil.","x":null,"s":"ok","n":"","k":["ped15"]},{"i":167,"l":11,"d":"Osler › Clínica Cirúrgica › Cirurgia Pediátrica › Malformações Genitourinárias › Malformações de Vias Urinárias","a":"Pediatria","f":"Hidronefrose Antenatal. Qual achado na ultrassonografia morfológica sugere comprometimento de função renal?","b":"Hidronefrose Antenatal. Qual achado na ultrassonografia morfológica sugere comprometimento de função renal? Oligodrâmnio. Quando ocorre associado ao achado de hidronefrose, seja por patologia obstrutiva ou não, devemos ficar atentos para a possibilidade de disfunção renal.","x":null,"s":"ok","n":"","k":["co11"]},{"i":168,"l":11,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Catarata","a":"Oftalmologia","f":"Catarata. São as principais complicações imediatas da cirurgia: [...] Edema corneano Deslocamento de lente","b":"Catarata. São as principais complicações imediatas da cirurgia: Endoftalmite Edema corneano Deslocamento de lente Endoftalmite é uma infecção do interior do bulbo do olho. Para prevenir é aplicado iodopovidona na superfície ocular durante o pré-operatório. Na prática clínica também são utilizadas gotas de antibióticos, mas não há estudos que comprovem. Há outras mais raras, como a síndrome tóxica do segmento anterior, que é a inflamação do segmento anterior por uma causa não infecciosa (e.g., substâncias,…","x":"Complicações da cirurgia de catarata: detalhe de especialista","s":null,"n":"","k":[]},{"i":169,"l":11,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Distúrbios da Refração","a":"Oftalmologia","f":"Lentes de Contato. São as complicações não-infecciosas mais comuns: [...] Lesões corneanas Deslocamento da lente de contato","b":"Lentes de Contato. São as complicações não-infecciosas mais comuns: Xeroftalmia Lesões corneanas Deslocamento da lente de contato Xeroftalmia é comum. A principal causa de descontinuação do uso. O manejo inclui o uso de lágrimas artificiais. As lesões epiteliais da córnea ocorrem por diversos motivos: trauma mecânico, hipóxia (lembre que a córnea é avascular e nutrida por embebição), ressecamento, toxicidade química (lembre que a lente absorve substâncias), etc. Um dos maiores medos dos pacientes é que a lente…","x":"Detalhe de oftalmologista (lentes de contato)","s":null,"n":"","k":[]},{"i":170,"l":11,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Doenças da Pálpebra","a":"Oftalmologia","f":"Doenças da Pálpebra. [...] são nódulos subcutâneos solitários, de crescimento lento, firmes, móveis, mais comumente encontrados na pálpebra superior.","b":"Doenças da Pálpebra. Cistos de inclusão epidérmica são nódulos subcutâneos solitários, de crescimento lento, firmes, móveis, mais comumente encontrados na pálpebra superior. Podem se formar após trauma ou cirurgia, ou podem ser congênitos. Geralmente são indolores, a menos que se infectem ou rompam, causando uma reação inflamatória. O tratamento não é necessário, a menos que desejado pelo paciente. Se for realizada excisão cirúrgica, todo o cisto, incluindo sua parede, deve ser removido para evitar recorrência.","x":"Cisto de inclusão palpebral: quase não cai","s":null,"n":"","k":[]},{"i":171,"l":11,"d":"Osler › Clínica Médica › Infectologia › Úlceras Genitais › Abordagem das Úlceras Genitais","a":"Clínica Médica","f":"Úlceras Genitais. As infecções que cursam com bubões e fistulização são: Cancroide [...]","b":"Úlceras Genitais. As infecções que cursam com bubões e fistulização são: Cancroide Linfogranuloma venéreo No cancroide, a fistulização ocorre por orifício único, e no linfogranuloma por múltiplos orifícios, em \"bico de regador\".","x":null,"s":"ok","n":"","k":["amb14"]},{"i":172,"l":11,"d":"Osler › Clínica Médica › Pneumologia › Asma › Asma Ambulatorial no Adulto e na Criança","a":"Clínica Médica","f":"Asma. Os corpos de [...] são aglomerados de células epiteliais descamadas.","b":"Asma. Os corpos de Creola são aglomerados de células epiteliais descamadas. Trata-se de um achado histopatológico compatível com lesão do epitélio das vias aéreas, podendo ser observado no escarro de pacientes com asma. É um achado originalmente atribuído à asma em adultos. No entanto, um paper muito interessante sugere a presença desses aglomerados no escarro de crianças com bronquiolite, e mostra uma correlação com esse achado e a evolução para sibilância recorrente ou asma.","x":"Histologia (corpos de Creola): baixa incidência","s":null,"n":"","k":[]},{"i":173,"l":11,"d":"Osler › Ginecologia e Obstetrícia › Obstetrícia › O Parto › Assistência ao Trabalho de Parto","a":"GO","f":"Assistência ao Segundo Período do Parto. Após o desprendimento do polo cefálico, ocorre fisiologicamente a [...] .","b":"Assistência ao Segundo Período do Parto. Após o desprendimento do polo cefálico, ocorre fisiologicamente a rotação externa . Pode ser guiada e facilitada pelo obstetra, mas respeitando a tendência de rotação do feto.","x":null,"s":"ok","n":"","k":["co02"]},{"i":174,"l":11,"d":"Osler › Ginecologia e Obstetrícia › Obstetrícia › O Parto › Fórceps","a":"GO","f":"Fórceps São indicações MATERNAS de fórceps: Exaustão Doença cardíaca [...]","b":"Fórceps São indicações maternas de fórceps: Exaustão Doença cardíaca Período expulsivo prolongado Não queremos que uma gestante cardiopata fique fazendo manobras de valsalva a cada 3 minutos.","x":null,"s":"ok","n":"","k":["co06"]},{"i":175,"l":11,"d":"Osler › Ginecologia e Obstetrícia › Obstetrícia › Vitalidade Fetal e Restrição de Crescimento Intrauterino › Cardiotocografia","a":"GO","f":"Car nuloma de corpo estranho","b":"Estrabismo. São as principais complicações cirúrgicas : Infecção Reação alérgica Granuloma de corpo estranho Infecções podem manifestar-se de diversas formas: conjuntivite bacteriana, que geralmente é leve e se resolve com antibióticos tópicos, blefarite, endoftalmite e celulite pré-septal/orbitária. As reações alérgicas podem ocorrer em pacientes sensíveis aos materiais ou medicamentos utilizados no período perioperatório. Um granuloma de corpo estranho pode se desenvolver em pacientes suscetíveis, geralmente…","x":"Complicações de cirurgia de estrabismo: quase não cai","s":null,"n":"","k":[]},{"i":223,"l":10,"d":"Osler › Clínica Cirúrgica › Trauma › Avaliação Inicial › Avaliação Inicial no Trauma","a":"Cirurgia","f":"Avaliação Inicial no Trauma. A avaliação primária envolve monitorizações. As principais são: Frequência respiratória Capnografia Oximetria de pulso Eletrocardiografia Pressão arterial [...] Temperatura Sonda gástrica Sonda vesical","b":"Avaliação Inicial no Trauma. A avaliação primária envolve monitorizações. As principais são: Frequência respiratória Capnografia Oximetria de pulso Eletrocardiografia Pressão arterial Glicemia capilar Temperatura Sonda gástrica Sonda vesical Achou difícil lembrar todos? Sob o nervoso de atender um trauma, será bem pior. Sue na batalha para não sangrar na guerra, e macete esses flashcards. Curiosamente, o ATLS cita a gasometria. De fato, com aparelhos point-of-care, ela pode ser obtida muito rapidamente, na própria…","x":null,"s":"nuance","n":"Adjuntos da avaliação primária no ATLS: ECG, oximetria, capnografia, gasometria, sondas vesical e gástrica, RX de tórax e pelve e eFAST. Glicemia não é adjunto formal, mas é checada em quem rebaixa.","k":["cc22"]},{"i":224,"l":10,"d":"Osler › Clínica Médica › Endocrinologia › Diabetes Mellitus › Retinopatia Diabética","a":"Clínica Médica","f":"Retinopatia Diabética. Quando proliferativa , o que leva à perda visual temporária ?","b":"Retinopatia Diabética. Quando proliferativa , o que leva à perda visual temporária ? Hemorragia vítrea. Os neovasos são frágeis, e podem sangrar no vítreo. O sangue, turvo, bloqueia a passagem de luz. Porém, geralmente há reabsorção do sangue, e a visão retorna.","x":null,"s":"ok","n":"","k":["amb06"]},{"i":225,"l":10,"d":"Osler › Clínica Médica › Infectologia › Antibioticoterapia › Cefalosporinas","a":"Clínica Médica","f":"Cefalosporinas de Primeira Geração. São exemplos com formulação parenteral: Cefazolina [...]","b":"Cefalosporinas de Primeira Geração. São exemplos com formulação parenteral: Cefazolina Cefalotina","x":null,"s":"ok","n":"","k":["cc29"]},{"i":226,"l":10,"d":"Osler › Clínica Médica › Infectologia › Úlceras Genitais › Abordagem das Úlceras Genitais","a":"Clínica Médica","f":"Úlceras Genitais. As infecções que cursam com bubões e fistulização são: [...] Linfogranuloma venéreo","b":"Úlceras Genitais. As infecções que cursam com bubões e fistulização são: Cancroide Linfogranuloma venéreo No cancroide, a fistulização ocorre por orifício único, e no linfogranuloma por múltiplos orifícios, em \"bico de regador\".","x":null,"s":"ok","n":"","k":["amb14"]},{"i":227,"l":10,"d":"Osler › Clínica Médica › Infectologia › Úlceras Genitais › Abordagem das Úlceras Genitais","a":"Clínica Médica","f":"Úlceras Genitais. As infecções que produzem múltiplas úlceras são: Herpes Cancroide [...]","b":"Úlceras Genitais. As infecções que produzem múltiplas úlceras são: Herpes Cancroide Donovanose Herpes é sempre com múltiplas lesões. Cancroide e donovanose podem ser ou não.","x":null,"s":"ok","n":"","k":["amb13"]},{"i":228,"l":10,"d":"Osler › Ginecologia e Obstetrícia › Ginecologia › Ginecologia Endócrina › Infertilidade - Tratamento","a":"GO","f":"Fertilização in vitro . O primeiro passo é a estimulação ovariana, usualmente realizada com [...] e FSH.","b":"Fertilização in vitro . O primeiro passo é a estimulação ovariana, usualmente realizada com antagonista de GnRH e FSH. O objetivo é maximizar o número de oócitos maduros para a extração. Lembre que são fertilizados vários oócitos, com o objetivo de formar alguns embriões, dos quais os “melhores” serão selecionados, com o objetivo final de transferir 1-3 para a cavidade uterina. O FSH, diário, recruta os folículos. O antagonista de GnRH bloqueia a secreção natural de FSH/LH, assim evitando que ocorra a ovulação.…","x":"Reprodução assistida (FIV): baixa incidência","s":null,"n":"","k":[]},{"i":229,"l":10,"d":"Osler › Ginecologia e Obstetrícia › Obstetrícia › Vitalidade Fetal e Restrição de Crescimento Intrauterino › Cardiotocografia","a":"GO","f":"Cardiotocografia. Com o aumento da idade gestacional, ocorre [aumento / diminuição] gradual da frequência da linha de base.","b":"Cardiotocografia. Com o aumento da idade gestacional, ocorre diminuição gradual da frequência da linha de base.","x":null,"s":"ok","n":"","k":["co10"]},{"i":230,"l":10,"d":"Osler › Ginecologia e Obstetrícia › Obstetrícia › Vitalidade Fetal e Restrição de Crescimento Intrauterino › Cardiotocografia","a":"GO","f":"Cardiotocografia. Indicações comuns para a realização da cardiotocografia anteparto incluem: Risco elevado de sofrimento fetal, [...] , Gestação de alto risco.","b":"Cardiotocografia. Indicações comuns para a realização da cardiotocografia anteparto incluem: Risco elevado de sofrimento fetal, Suspeita de restrição de crescimento intrauterino , Gestação de alto risco. Basicamente, para avaliação de vitalidade e bem estar fetal, para além do momento do TP. Se a gestação é de baixo risco, sem nenhum indicativo de mau prognóstico… não é uma avaliação obrigatória.","x":null,"s":"ok","n":"","k":["co10"]},{"i":231,"l":10,"d":"MEDICINA_3ANO › EC2 › Psiquiatria","a":"Psiquiatria","f":"Transtorno de Ansiedade social , quando surge: […]","b":"Transtorno de Ansiedade social , quando surge: ⟦Idade escolar⟧","x":"Idade de início de transtorno ansioso: baixa incidência","s":null,"n":"","k":[]},{"i":232,"l":10,"d":"MEDICINA_4ANO › COLOPROC e Cintilografia com Tecnécio–99m. Enquanto a arteriografia mesentérica é usada em casos de sangramento rápido, com instabilidade hemodinâmica, a cintilografia é reservada para pacientes hemodinamicamente estáveis ​​com sangramento gastrointestinal menos grave ou intermitente.","x":null,"s":"ok","n":"","k":["ped20"]},{"i":309,"l":9,"d":"Osler › Clínica Cirúrgica › Cirurgia Pediátrica › Malformações Gastrointestinais › Atresia Intestinal","a":"Pediatria","f":"Atresia Intestinal. Atresia jejunal ou ileal estão associadas a que doença congênita?","b":"Atresia Intestinal. Atresia jejunal ou ileal estão associadas a que doença congênita? Fibrose cística. Devido ao mecônio espessado e ao volvo durante a vida fetal, causando isquemia.","x":null,"s":"ok","n":"","k":["ped19"]},{"i":310,"l":9,"d":"Osler › Clínica Cirúrgica › Cirurgia Pediátrica › Malformações Gastrointestinais › Gastrosquise e Onfalocele","a":"Pediatria","f":"Gastrosquise. No pós-operatório, qual é a complicação gastrointestinal esperada?","b":"Gastrosquise. No pós-operatório, qual é a complicação gastrointestinal esperada? Dismotilidade intestinal. Outras complicações possíveis são suboclusão intestinal, síndrome do intestino curto pós-ressecção e obstrução mecânica.","x":null,"s":"ok","n":"","k":["ped19"]},{"i":311,"l":9,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Abrasão Corneana e Corpo Estranho","a":"Oftalmologia","f":"Abrasão Corneana. As principais manifestações clínicas são: Dor ocular grave Fotofobia [...]","b":"Abrasão Corneana. As principais manifestações clínicas são: Dor ocular grave Fotofobia Sensação de corpo estranho O epitélio da córnea é ricamente inervado por fibras sensoriais do nervo trigêmeo. O conjunto de dor ocular e evidência de fotofobia e/ou sensação de corpo estranho é fortemente indicativo de uma patologia da córnea.","x":null,"s":"ok","n":"","k":["amb05"]},{"i":312,"l":9,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Conjuntivites","a":"Oftalmologia","f":"Conjuntivite Viral & Alérgica Aguda. O tratamento pode consistir em: Anti-histamínicos Descongestionantes [...]","b":"Conjuntivite Viral & Alérgica Aguda. O tratamento pode consistir em: Anti-histamínicos Descongestionantes Compressas frias Sim, o tratamento das conjuntivites viral e alérgica é bem parecido. Por isso, condesamos em um card. 😁 Cetotifeno e olopatadina são anti-histamínicos tópicos. Também pode ser utilizado loratadina ou dexclorfeniramina por via oral. Em geral, o UpToDate dá preferência aos medicamentos tópicos , tanto pela ação rápida como pela menor chance de efeitos sistêmicos. Agora, se o paciente tem…","x":null,"s":"ok","n":"","k":["amb04"]},{"i":313,"l":9,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Doenças da Pálpebra","a":"Oftalmologia","f":"Blefarite. O tratamento geral envolve: Eliminação de gatilhos Compressas quentes [...]","b":"Blefarite. O tratamento geral envolve: Eliminação de gatilhos Compressas quentes Massagem e limpeza palpebral Os pacientes devem ser informados de que é uma condição crônica e que em muitos casos precisa de cuidados a longo prazo. A intensidade do tratamento varia de acordo com os sintomas do paciente. Eles devem ser aconselhados a eliminar ou limitar potenciais gatilhos ou fatores de exacerbação (e.g., alérgenos, tabagismo, etc). Não precisa suspender o uso de lentes de contato, caso seja confortável usá-las. A…","x":"Blefarite: detalhe de especialista","s":null,"n":"","k":[]},{"i":314,"l":9,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Doenças da Pálpebra","a":"Oftalmologia","f":"Oftalmologia. [...] é resultado da obstrução das glândulas sebáceas e se apresenta como um nódulo não-doloroso na pálpebra.","b":"Oftalmologia. Calázio é resultado da obstrução das glândulas sebáceas e se apresenta como um nódulo não-doloroso na pálpebra. O nome vem do grego “khalázios”, que significa pedra de granizo. É um lipogranuloma crônico e estéril que se forma na pálpebra devido à obstrução das glândulas sebáceas, especificamente das glândulas de Meibômio. Resulta de uma reação granulomatosa causada pela retenção das secreções glandulares obstruídas. Olha aí e decida por si mesmo se parece uma pedra de granizo ou não. 😂","x":null,"s":"ok","n":"","k":["amb03"]},{"i":315,"l":9,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Glaucoma","a":"Oftalmologia","f":"Glaucoma de Ângulo Fechado. Quando agudo , os principais sinais são: Hiperemia conjuntival Edema de córnea [...] Câmara anterior rasa","b":"Glaucoma de Ângulo Fechado. Quando agudo , os principais sinais são: Hiperemia conjuntival Edema de córnea Pupilas midriáticas fixas Câmara anterior rasa A injeção conjuntival é significativa. A córnea desenvolve edema estromal e microcístico em resposta ao aumento agudo da pressão ocular e à descompensação do mecanismo de bomba endotelial. A isquemia do esfíncter da íris leva a uma pupila midriática fixa. A câmara anterior geral é rasa. O centro geralmente é formado, mas a íris média-periférica se curva para a…","x":null,"s":"nuance","n":"A pupila típica é médio-midriática e fixa (não midríase máxima).","k":["amb01"]},{"i":316,"l":9,"d":"Osler › Clínica Cirúrgica › Oftalmologia › Glaucoma","a":"Oftalmologia","f":"Glaucoma de Ângulo Fechado. Quando agudo, os principais sintomas são: Redução da acuidade visual Cefaleia [...] Náuseas e vômitos","b":"Glaucoma de Ângulo Fechado. Quando agudo, os principais sintomas são: Redução da acuidade visual Cefaleia Dor ocular grave Náuseas e vômitos A rapidez e o grau de elevação da pressão intraocular e do fechamento angular determinam a ocorrência e gravidade dos sintomas. As manifestações do glaucoma agudo geralmente ocorrem à noite, quando os níveis mais baixos de luz causam midríase e as dobras da íris periférica bloqueiam o ângulo estreito.","x":null,"s":"ok","n":"Confere.","k":["amb01"]},{"i":317,"l":9,"d":"Osler › Clínica Médica › Pneumologia › Asma › Exacerbação da Asma no Adulto e na Criança","a":"Clínica Médica","f":"Exacerbação Asmática. O salbutamol nebulizado usualmente é prescrito como [...] mg diluídos em 3mL de SF 0.9%.","b":"Exacerbação Asmática. O salbutamol nebulizado usualmente é prescrito como 2,5 mg diluídos em 3mL de SF 0.9%. Pode ser até 5mg.","x":null,"s":"ok","n":"","k":["ps14"]},{"i":318,"l":9,"d":"Osler › Ginecologia e Obstetrícia › Obstetrícia › Vitalidade Fetal e Restrição de Crescimento Intrauterino › Dopplervelocimetria e Perfil Biofísico Fetal","a":"GO","f":"Perfil Biofísico Fetal. No PBF, os movimentos respiratórios podem ser avaliados a partir de [...] semanas.","b":"Perfil Biofísico Fetal. No PBF, os movimentos respiratórios podem ser avaliados a partir de 11 semanas.","x":null,"s":"fix","n":"Para prova vale a sequência de Vintzileos: tônus (7,5–8,5 sem) → movimentos corporais (9 sem) → movimentos respiratórios (20–21 sem) → reatividade da FCF (24–28 sem). Na hipóxia somem na ordem inversa. Movimentos respiratórios isolados aparecem ao USG desde ~10–11 sem, mas não é isso que a prova cobra.","k":["co10"]},{"i":319,"l":9,"d":"Osler › Multimídia › Clínica Médica › Infecções Sexualmente Transmissíveis","a":"Clínica Médica","f":"Multimídia. Lesões intensamente dolorosas. Qual é o diagnóstico?","b":"Multimídia. Lesões intensamente dolorosas. Qual é o diagnóstico? Herpes genital. As lesões genitais são mais comumente causadas pelo HSV-2. Pacientes com primo-infecção pelo vírus apresentam sintomas sistêmicos de febre e mialgias 1 a 3 dias antes do surgimento das ulceras genitais características.","x":null,"s":"ok","n":"","k":["amb13"]},{"i":320,"l":9,"d":"MEDICINA_4ANO › ORTOPEDIA","a":"Ortopedia","f":"Clínica da fratura de fêmur proximal -> […]","b":"Clínica da fratura de fêmur proximal -> ⟦Dor no Quadril, Encurtamento e rotação externa⟧","x":null,"s":"ok","n":"","k":["cc24"]},{"i":321,"l":9,"d":"MEDICINA_4ANO › MUT","a":"Clínica Médica","f":"Valores superiores ao esperado de G (A-a) na vigência de hipoxemia sugerem […]","b":"Valores superiores ao esperado de G (A-a) na vigência de hipoxemia sugerem ⟦alterações no processo de oxigenação, como efeito shunt, distúrbio V/Q e alterações na barreira de troca⟧","x":null,"s":"ok","n":"","k":["uti26"]},{"i":322,"l":9,"d":"MEDICINA_4ANO › COLOPROCTO","a":"Cirurgia","f":"Colon / Pólipos, classificação histológica : […]","b":"Colon / Pólipos, classificação histológica : ⟦Neoplásico (Maligno ou benigno) ou Não neoplásico (Hiperplásico, Inflamatório ou Hamartoma)⟧","x":null,"s":"ok","n":"","k":["cc12"]},{"i":323,"l":9,"d":"MEDICINA_4ANO › TORÁCICA","a":"Cirurgia","f":"Os tumores mais frequentes da pleura são secundários. Os sítios mais comuns são:","b":"Pulmão / Mama / Ovários","x":null,"s":"ok","n":"","k":["cc18"]},{"i":324,"l":9,"d":"MEDICINA_4ANO › PEDIATRIA","a":"Pediatria","f":"Sepse tardia / Tratamento inicial","b":"Vancomicina + Amicacina","x":null,"s":"nuance","n":"Manual do MS: oxacilina + amicacina; troca-se oxacilina por vancomicina onde há muito MRSA/estafilococo coagulase-negativo (cateter).","k":["ped14"]},{"i":325,"l":9,"d":"MEDICINA_4ANO › GERAL","a":"Cirurgia","f":"Poliglicóico","b":"Dexon (Multifilamentar) / o monofilamentar e poligliconato é o Maxon","x":"Nome comercial de fio de sutura","s":null,"n":"","k":[]},{"i":326,"l":9,"d":"MEDICINA_4ANO › GERAL","a":"Cirurgia","f":"Critérios de Tokyo (TG18/TG13) Colangite aguda moderada (5)","b":"Sem disfunção orgânica + 2 dos achados: / Leucócitos > 12k ou <4k / Febre > 39 graus / Idade > 75 anos / BT > 5 / Hipoalbuminemia","x":null,"s":"ok","n":"","k":["cc02"]},{"i":327,"l":9,"d":"MEDICINA_4ANO › VASCULAR","a":"Cirurgia","f":"DAOP - FONTAINE / Estágio III","b":"Dor isquêmica em repouso","x":null,"s":"ok","n":"","k":["cc19"]},{"i":328,"l":9,"d":"MEDICINA_3ANO › EC2 › Neurologia","a":"Clínica Médica","f":"Receptor Delta / efeitos","b":"Analgesia e alterações no humor","x":"Farmacologia básica (receptor delta)","s":null,"n":"","k":[]},{"i":329,"l":9,"d":"PREVENTIVA","a":"Preventiva","f":"Teste de LaVene","b":"LaVariancia / Usado para avaliar se a variância de 2 ou mais grupos é igual","x":"Estatística avançada (teste de Levene)","s":null,"n":"","k":[]},{"i":330,"l":9,"d":"PREVENTIVA","a":"Preventiva","f":"Febre Amarela e Difteria são de notificação semanal ou imediata?","b":"Imediata","x":null,"s":"ok","n":"Ambas são de notificação imediata (até 24 h) na lista nacional.","k":["ps18"]},{"i":331,"l":9,"d":"MEDICINA_4ANO › Obstetrícia","a":"GO","f":"Principal complicação de pacientes com polidramnio no pós-parto","b":"Hemorragia","x":null,"s":"ok","n":"","k":["co05"]},{"i":332,"l":9,"d":"MEDICINA_3ANO › EC1 › hematologia","a":"Clínica Médica","f":"Aspirado SECO de MO o que pensar","b":"Aplasia medular ou Tricoleucemia","x":null,"s":"fix","n":"Aspirado seco (dry tap): mielofibrose e tricoleucemia são os clássicos; também infiltração neoplásica e aplasia. O card esquecia a mielofibrose.","k":["uti24"]},{"i":333,"l":9,"d":"MEDICINA_3ANO › EC2 › Endocrino","a":"Clínica Médica","f":"Lipoproteínas / VLDL, qual a composição","b":"55% TG e 20% colesterol","x":"Bioquímica (composição de VLDL)","s":null,"n":"","k":[]}],"cases":[{"id":"ps01","s":"ps","t":"Coração desgovernado","p":"Dona Cleide, 68 anos","cc":"Palpitações há 6 horas","v":{"pa":"128/76","fc":142,"sat":95,"fr":20,"t":36.4},"d":[["marcos","Leito 3. ECG na mão: RR irregular, sem onda P."],["helena","Antes de pensar em droga, me diz o que você procura no exame dela."]],"q":[{"q":"A filha pergunta o que a FA costuma causar. Qual a apresentação típica?","o":["Pode ser assintomática; quando dá sintoma: palpitações, dispneia e dor precordial","Síncope ao esforço, angina e sopro ejetivo","Febre, sopro novo e fenômenos embólicos","Cefaleia, sudorese e palpitações em crises com PA muito alta"],"c":[56],"e":"FA pode ser achado de ECG. Quando sintomática: palpitações, dispneia, dor precordial (e fadiga). A tríade síncope + angina + dispneia é da estenose aórtica.","m":["Um sambista desafinado toca tamborim DENTRO do peito da Dona Cleide: o coração PALPITA, o ar FALTA e o peito APERTA. Às vezes ele toca no mudo e ninguém percebe.",[["tamborim fora do ritmo","FA (RR irregular)"],["palpita, falta ar, aperta","palpitação, dispneia, dor precordial"],["toca no mudo","pode ser assintomática"]]]},{"q":"Quais achados definiriam instabilidade e indicariam cardioversão elétrica imediata?","o":["Hipotensão, síncope/rebaixamento, dor torácica isquêmica ou congestão pulmonar","FC acima de 150 bpm, independentemente da clínica","Idade acima de 65 anos com FA de início < 48 h","Palpitação com dispneia leve e PA normal"],"c":[274],"e":"Instabilidade é clínica, não um número: ↓PA, síncope/alteração de consciência, dor torácica e congestão pulmonar (IC aguda).","x":"Você esperou a FC passar de 150 para agir. Ela já estava estável — e o paciente do leito ao lado, hipotenso, ficou sem choque.","m":["O paciente CAI da maca: desmaia, fica azul se afogando, agarra o peito e a pressão escorre pelo chão como água.",[["desmaia","síncope / rebaixamento"],["se afogando","congestão pulmonar"],["agarra o peito","dor isquêmica"],["pressão escorrendo","hipotensão"],["FC alta sozinha","NÃO é critério"]]]},{"q":"Ela está estável e a FA começou há 6 h. Você opta por controle de RITMO. Quais as opções?","o":["Cardioversão elétrica sincronizada, amiodarona ou propafenona","Diltiazem, metoprolol ou digoxina","Adenosina 6 mg em bolus rápido","Atropina e marca-passo transcutâneo"],"c":[194],"e":"Ritmo: choque sincronizado ou antiarrítmico (amiodarona; propafenona se não houver cardiopatia estrutural). Betabloqueador, BCC e digoxina controlam FREQUÊNCIA.","x":"Você fez diltiazem: a frequência caiu, mas ela segue em FA. Controle de frequência não é controle de ritmo.","m":["Um CAPitão de navio põe a tripulação em fila com um CHOQUE de taser, uma garrafa de AMIOdarona e um PROPAgandista berrando no megafone. O freio de mão só deixa o navio mais lento.",[["CAP","Choque, Amiodarona, Propafenona = controle de RITMO"],["freio de mão","betabloqueador, diltiazem, digoxina = só FREQUÊNCIA"]]]}]},{"id":"ps02","s":"ps","t":"QRS estreito a 186","p":"Rafael, 24 anos","cc":"Taquicardia de início súbito","v":{"pa":"118/70","fc":186,"sat":98,"fr":18,"t":36.6},"d":[["marcos","Começou do nada, jogando futebol. Regular, rápido demais."],["caio","Deixa comigo, isso é sinusal de ansiedade!"],["helena","Caio, olha o ECG antes de abrir a boca."]],"q":[{"q":"ECG: QRS estreito, sem P visível antes do QRS, pseudo-S em DII, DIII e aVF e pseudo-r' em V1. Diagnóstico?","o":["Taquicardia por reentrada nodal (P' retrógrada colada ao QRS, RP' < 70 ms)","Taquicardia por via acessória ortodrômica (RP' ≥ 70 ms)","Flutter atrial 2:1","Taquicardia sinusal"],"c":[195],"e":"Na TRN a P retrógrada cai dentro/logo após o QRS: pseudo-S inferior e pseudo-r' em V1, RP' < 70 ms.","m":["Um CHICLETE nodal gruda a onda P dentro do QRS: ela some e só sobra um rabinho de S nas derivações inferiores e um chifrinho r' em V1.",[["chiclete grudado","reentrada nodal, RP' < 70 ms"],["rabinho de S","pseudo-S em DII, DIII, aVF"],["chifrinho","pseudo-r' em V1"]]]},{"q":"Outro paciente, com WPW conhecido: QRS estreito e P' retrógrada bem afastada do QRS (RP' ≥ 70 ms). Qual o circuito?","o":["Ortodrômica: desce pelo nó AV e sobe pela via acessória (QRS estreito)","Antidrômica: desce pela via acessória e sobe pelo nó (QRS estreito)","Reentrada nodal típica lenta-rápida","Taquicardia atrial focal com BAV"],"c":[134],"e":"Ortodrômica = anterógrada pelo nó AV → QRS estreito, RP' ≥ 70 ms. Antidrômica = anterógrada pela via acessória → QRS LARGO (pré-excitado).","m":["Um padre ORTOdoxo entra pela porta da frente da igreja e sai pela janela dos fundos, dando a volta longa. O ANTI-padre entra pela janela e derruba todos os bancos.",[["porta da frente","anterógrado pelo nó AV → QRS estreito (ortodrômica)"],["volta longa","RP' ≥ 70 ms"],["bancos derrubados","antidrômica → QRS largo"]]]}]},{"id":"ps03","s":"ps","t":"Vê tudo amarelo","p":"Seu Arlindo, 79 anos","cc":"Náuseas, vômitos e \"visão amarelada\"","v":{"pa":"110/68","fc":52,"sat":94,"fr":18,"t":36.2},"d":[["marcos","Usa digoxina e furosemida. Potássio de 2,9. Monitor mostrando bigeminismo."],["helena","Junta as peças."]],"q":[{"q":"Sintomas gastrointestinais + arritmia neste paciente. Hipótese principal?","o":["Intoxicação digitálica, potencializada pela hipocalemia","Intoxicação por lítio","Síndrome colinérgica por organofosforado","Hipercalcemia por diurético"],"c":[136],"e":"Digital: náuseas, vômitos, xantopsia e arritmias (bigeminismo, TA com BAV, TV bidirecional). Hipocalemia potencializa. Conduta: suspender, corrigir K e Mg, anticorpo antidigoxina se grave.","x":"Você manteve a digoxina e repôs só soro: ele evolui com TV bidirecional.","m":["Seu Arlindo pinta o quarto inteiro de AMARELO como Van Gogh, vomita num balde e o coração bate em DUPLAS. Na mesa, um vaso de dedaleira (Digitalis).",[["tudo amarelo","xantopsia"],["balde","náuseas e vômitos"],["batidas em dupla","bigeminismo / arritmia digitálica"],["potássio baixo","potencializa a toxicidade"]]]},{"q":"E o que a hipocalemia faz por conta própria?","o":["Onda U, QT(U) prolongado, arritmias, fraqueza e até rabdomiólise","Onda T apiculada e QRS alargado","QT curto e encurtamento do ST","Onda J de Osborn"],"c":[215],"e":"HipoK: fraqueza, íleo, rabdomiólise, arritmias, onda U e QT prolongado. T apiculada é hiperK; QT curto é hiperCa; onda J é hipotermia.","m":["No ECG a onda T afunda num buraco e de lá sai uma onda U gritando 'U-U-U, cadê meu potássio?'. O braço do paciente cai mole como macarrão.",[["onda U","hipocalemia, QT(U) longo, arritmia"],["macarrão","fraqueza, íleo, rabdomiólise"],["T pontuda","isso é HIPERcalemia"]]]}]},{"id":"ps04","s":"ps","t":"O agricultor que babava","p":"Sr. Valdir, 52 anos","cc":"Trazido da lavoura confuso","v":{"pa":"96/60","fc":46,"sat":88,"fr":28,"t":36.8},"d":[["marcos","Miose puntiforme, babando, sibilando, fasciculando. Monitor com QT longo."],["helena","Cheira a veneno de lavoura. O que é?"]],"q":[{"q":"Qual a intoxicação?","o":["Organofosforado (inibição da acetilcolinesterase)","Antidepressivo tricíclico","Opioide","Digital"],"c":[197],"e":"Síndrome colinérgica: miose, sialorreia, broncorreia, bradicardia, fasciculações. QT longo e torsades podem ocorrer. Conduta: descontaminar, atropina até secar secreções, pralidoxima.","x":"Você deu naloxona: nada muda e as secreções continuam afogando o paciente.","m":["O agricultor vira uma fonte de praça: baba, chora, sua, faz xixi e diarreia ao mesmo tempo, com pupilas de alfinete. O bombeiro chega com um balde de ATROPINA e só para quando a fonte seca.",[["fonte jorrando","síndrome colinérgica (organofosforado)"],["alfinete","miose"],["coração lento","bradicardia, QT longo"],["até a fonte secar","atropina até secar secreções + pralidoxima"]]]}]},{"id":"ps05","s":"ps","t":"Cartela vazia","p":"Juliana, 31 anos","cc":"Ingeriu comprimidos de amitriptilina","v":{"pa":"92/58","fc":128,"sat":96,"fr":20,"t":37.6},"d":[["marcos","Pupila midriática, pele seca, bexigoma. QRS de 130 ms."],["helena","Tricíclico é veneno de coração. O que ele faz?"]],"q":[{"q":"Quais efeitos adversos/tóxicos dos tricíclicos?","o":["Anticolinérgicos, hipotensão ortostática, sedação, arritmias (QRS largo) e ganho de peso","Só síndrome serotoninérgica, sem efeito cardíaco","Hiponatremia e disfunção sexual como únicos efeitos","Hipertensão e bradicardia por ação colinérgica"],"c":[283],"e":"Tricíclicos: anticolinérgico, bloqueio α (hipotensão), anti-histamínico (sedação, peso) e bloqueio de canal de sódio (QRS largo, arritmia). QRS >100 ms → bicarbonato de sódio.","x":"Você não tratou o QRS largo: ela faz TV no monitor.","m":["Um TRICICLO desgovernado atropela a Juliana. Roda 1 seca a boca, roda 2 derruba a pressão, roda 3 dá sono e fome. O guidão torto ALARGA o QRS.",[["roda 1","anticolinérgico"],["roda 2","hipotensão (bloqueio α)"],["roda 3","sedação e ganho de peso"],["guidão torto","bloqueio de sódio → QRS largo → bicarbonato"]]]}]},{"id":"ps06","s":"ps","t":"Lítio demais","p":"Sra. Teresa, 45 anos","cc":"Tremor, diarreia e sonolência","v":{"pa":"104/66","fc":58,"sat":97,"fr":16,"t":36.9},"d":[["marcos","Bipolar, usa lítio. Pegou uma gastroenterite semana passada."],["helena","Desidratou e o lítio subiu. Faz sentido?"]],"q":[{"q":"Quadro compatível com intoxicação por lítio:","o":["Tremor, náuseas/vômitos, diarreia, sonolência, ataxia e arritmias","Rigidez em cano de chumbo, hipertermia e CPK altíssima","Clônus, hiper-reflexia e midríase","Exoftalmia, taquicardia e perda de peso"],"c":[201],"e":"Lítio: GI (náusea, vômito, diarreia), neuro (tremor grosseiro, ataxia, sonolência, confusão) e arritmias. Rigidez + hipertermia = neuroléptica maligna; clônus = serotoninérgica.","m":["Uma PILHA de lítio gigante superaquece na barriga da Sra. Teresa: ela TREME como celular no vibra, vomita, tem diarreia, dorme em pé e anda como bêbada.",[["vibra","tremor"],["barriga","náusea, vômito, diarreia"],["dorme em pé","sonolência"],["bêbada","ataxia (+ arritmias)"]]]},{"q":"Ela também tem poliúria há meses, urina diluída, sem resposta à desmopressina. O que é?","o":["Diabetes insipidus nefrogênico (lítio, hipercalcemia/nefrocalcinose, Sjögren)","Diabetes insipidus central","SIADH","Polidipsia primária"],"c":[251],"e":"Lítio é a causa clássica de DI nefrogênico. Outras: hipercalcemia (nefrocalcinose), hipocalemia e Sjögren.","m":["O rim usa FONE DE OUVIDO de lítio e não escuta o ADH gritando 'segura a água!'. Dar desmopressina é aumentar o volume de quem está de fone.",[["rim surdo","diabetes insipidus NEFROGÊNICO"],["quem põe o fone","lítio, hipercalcemia, hipocalemia, Sjögren"],["aumentar o volume","desmopressina não funciona"]]]}]},{"id":"ps07","s":"ps","t":"Coma sem lado","p":"Sr. Jorge, 70 anos","cc":"Encontrado sonolento em casa","v":{"pa":"136/80","fc":88,"sat":95,"fr":14,"t":36},"d":[["marcos","Glasgow 8, sem déficit focal. Pupilas isocóricas, fotorreagentes."],["caio","Já pede TC e chama o neurocirurgião!"],["helena","Antes, me diz o que esse exame sugere."]],"q":[{"q":"Coma sem déficit focal e com pupilas fotorreagentes sugere:","o":["Causa tóxico-metabólica","Lesão estrutural supratentorial com herniação","Lesão pontina","Herniação uncal incipiente"],"c":[198],"e":"Na encefalopatia tóxico-metabólica o reflexo fotomotor se preserva até fases avançadas; déficit focal ou anisocoria apontam lesão estrutural. Primeiro passo: glicemia capilar.","m":["Um carro parado na estrada com os FARÓIS acesos e o volante reto: o motor engasgou por falta de GASOLINA, não por buraco na pista.",[["faróis acesos","pupilas fotorreagentes"],["volante reto","sem déficit focal"],["falta de gasolina","causa tóxico-metabólica (glicemia primeiro)"]]]}]},{"id":"ps08","s":"ps","t":"Inferior com pulmão limpo","p":"Seu Benedito, 63 anos","cc":"Dor torácica há 1 hora","v":{"pa":"82/50","fc":58,"sat":96,"fr":18,"t":36.5},"d":[["marcos","Supra em DII, DIII, aVF e V4R. Jugulares túrgidas, pulmão limpo."],["caio","IAM! Nitrato sublingual e morfina, rápido!"],["helena","Caio, segura a mão. Você decide."]],"q":[{"q":"Conduta para a hipotensão deste IAM de VD:","o":["Volume (cristaloide) e, se não responder, inotrópico (dobutamina); evitar nitrato e morfina","Nitroglicerina EV e furosemida","Morfina para a dor e diurético","Restrição hídrica e vasodilatador"],"c":[270],"e":"O VD infartado depende de pré-carga: volume. Sem resposta, dobutamina. Nitrato, morfina e diurético derrubam a pré-carga.","x":"O nitrato entrou: PA 58x30, ele rebaixa. A Dra. Helena abre o soro em bolus e olha feio para o Caio (e para você).","m":["O ventrículo direito é um barquinho encalhado. O Caio joga NITRATO e MORFINA e a maré baixa ainda mais. A Dra. Helena despeja baldes de SORO e o barco volta a navegar.",[["barco que depende da maré","VD depende de pré-carga"],["baldes de soro","volume"],["nitrato, morfina, diurético","proibidos"],["se não navegar","dobutamina"]]]}]},{"id":"ps09","s":"ps","t":"Papiledema às 4h","p":"Sr. Edson, 55 anos","cc":"Cefaleia, vômitos e confusão","v":{"pa":"238/136","fc":96,"sat":96,"fr":20,"t":36.7},"d":[["marcos","Convulsionou na sala de espera. Fundo de olho com papiledema e hemorragias."],["helena","Nomeia isso direito, porque o tratamento muda."]],"q":[{"q":"Diagnóstico?","o":["Encefalopatia hipertensiva (emergência hipertensiva)","Urgência hipertensiva","Pseudocrise hipertensiva","HAS estágio 3 sem lesão de órgão-alvo"],"c":[275],"e":"Encefalopatia hipertensiva: cefaleia, náuseas/vômitos, rebaixamento, convulsões, hemorragias retinianas e papiledema. Emergência: droga EV (nitroprussiato), reduzir PAM ~20–25% na 1ª hora.","x":"Você deu captopril oral e mandou aguardar: ele convulsiona de novo.","m":["A cabeça do Sr. Edson é uma panela de pressão: a tampa voa, o feijão espirra, a cozinha treme e o vapor embaça o fundo do olho.",[["panela explodindo","emergência (lesão de órgão-alvo)"],["feijão e tremor","vômitos, confusão, convulsão"],["vapor no olho","papiledema e hemorragias"],["o que fazer","droga EV, baixar PAM ~20–25% na 1ª hora"]]]}]},{"id":"ps10","s":"ps","t":"A pior dor de cabeça da vida","p":"Dona Rosa, 49 anos","cc":"Cefaleia súbita e explosiva","v":{"pa":"176/98","fc":64,"sat":97,"fr":16,"t":36.8},"d":[["marcos","TC: sangue nas cisternas da base. Fuma um maço por dia, bebe todo fim de semana."],["helena","HSA. Vamos montar o raciocínio inteiro."]],"q":[{"q":"Quais os fatores de risco dela para HSA?","o":["Tabagismo, etilismo, HAS e história familiar","DM, dislipidemia e obesidade","Uso de AAS e estatina","Sexo masculino e idade < 30 anos"],"c":[73],"e":"HSA aneurismática: tabagismo (o principal modificável), HAS, etilismo e história familiar (além de rins policísticos e colagenoses).","m":["Dona Rosa num churrasco de família: cigarro numa mão, cerveja na outra, o aparelho de pressão apitando e o tio contando que 'aqui todo mundo tem aneurisma'.",[["cigarro","tabagismo"],["cerveja","etilismo"],["aparelho apitando","HAS"],["o tio","história familiar"]]]},{"q":"No 7º dia ela rebaixa e surge hemiparesia nova. TC sem sangue novo. Qual complicação?","o":["Vasoespasmo (entre o 3º e o 14º dia)","Ressangramento, cujo pico é no 7º dia","Hidrocefalia, que só aparece após 3 semanas","Hipernatremia por SIADH"],"c":[259],"e":"Cronologia: ressangramento (maior risco nas primeiras 24 h), vasoespasmo (3º–14º dia; nimodipina), hidrocefalia (aguda ou tardia) e hiponatremia (SIADH ou cerebropatia perdedora de sal).","m":["Um calendário de parede: no dia 1 o aneurisma explode DE NOVO em fogos de artifício; do dia 3 ao 14 uma JIBOIA aperta as artérias; no fim do mês o cano entope e o saleiro esvazia.",[["fogos no dia 1","ressangramento (pico nas 1ªs 24 h)"],["jiboia, dias 3–14","vasoespasmo (nimodipina)"],["cano entupido","hidrocefalia"],["saleiro vazio","hiponatremia"]]]}]},{"id":"ps11","s":"ps","t":"Febre e nuca dura","p":"Leandro, 22 anos","cc":"Febre, cefaleia e rigidez de nuca","v":{"pa":"122/76","fc":104,"sat":98,"fr":18,"t":38.9},"d":[["marcos","Glasgow 15, sem déficit, sem papiledema. Imunocompetente. Nenhuma convulsão."],["caio","TC antes da punção, sempre!"],["helena","Sempre? Tem certeza?"]],"q":[{"q":"Precisa de TC antes da punção lombar?","o":["Não: TC só se déficit focal, rebaixamento, papiledema, imunossupressão celular ou convulsão na última semana","Sim, toda PL exige TC antes","Sim, porque há rigidez de nuca","Não, e o antibiótico deve esperar o resultado do líquor"],"c":[43],"e":"Critérios para TC antes da PL: déficit focal, ↓consciência, papiledema, imunossupressão celular, crise convulsiva recente (e doença prévia do SNC). Se suspeita bacteriana, antibiótico não espera.","x":"A TC desnecessária atrasou a punção em 3 horas.","m":["Na porta da sala de punção, uma placa: 'TC ANTES SE O PACIENTE FICOU…' e cinco desenhos: um boneco torto, um boneco numa bolha, um boneco dormindo, um olho inchado e um boneco tremendo.",[["F","déficit Focal"],["I","Imunossupressão celular"],["C","Consciência rebaixada"],["O","Olho com papiledema"],["U","convulsão nos Últimos 7 dias"]]]},{"q":"Líquor: 200 células com 80% linfócitos, glicose normal. Qual o agente mais comum de meningite em geral?","o":["Vírus (enterovírus)","Pneumococo","Meningococo","Haemophilus influenzae"],"c":[192],"e":"Meningite viral (enterovírus) é a mais frequente. Entre as bacterianas no adulto, pneumococo lidera.","m":["Na piscina do clube, um vírus de boia dá meningite em metade da turma de natação. A bactéria é o tubarão: assusta mais, mas aparece bem menos.",[["boia na piscina","enterovírus = causa mais comum"],["tubarão","bacteriana: mais grave, menos frequente"]]]}]},{"id":"ps12","s":"ps","t":"A pupila que abriu","p":"Motociclista, 30 anos","cc":"TCE grave","v":{"pa":"192/100","fc":48,"sat":93,"fr":8,"t":36.1},"d":[["marcos","Glasgow 7. Pupila DIREITA dilatada, sem reação. Respiração irregular."],["helena","Lê o paciente e me diz o que está acontecendo."]],"q":[{"q":"Midríase direita no TCE indica:","o":["Herniação de úncus à DIREITA (ipsilateral), comprimindo o III nervo","Herniação de úncus à esquerda (contralateral)","Herniação tonsilar","Lesão do simpático cervical"],"c":[246],"e":"O úncus herniado comprime o oculomotor do mesmo lado: midríase ipsilateral à lesão (hemiparesia geralmente contralateral).","m":["O úncus é um pé gigante que desce e PISA no III nervo do MESMO lado: a pupila daquele lado arregala de dor.",[["pisa do mesmo lado","midríase ipsilateral"],["lado da pupila","lado do hematoma"],["hemiparesia","geralmente contralateral"]]]},{"q":"PA alta + bradicardia + respiração irregular é:","o":["Tríade de Cushing (hipertensão intracraniana)","Tríade de Beck","Tríade de Charcot","Tríade de Virchow"],"c":[267],"e":"Cushing: hipertensão, bradicardia e alteração do ritmo respiratório. Sinal tardio de HIC. Beck é tamponamento; Charcot, colangite; Virchow, trombose.","m":["O cérebro espremido grita por sangue: o coração liga a mangueira no máximo, mas pisa no freio, e o pulmão respira tropeçando.",[["mangueira no máximo","PA sobe"],["pé no freio","bradicardia"],["respira tropeçando","respiração irregular → tríade de Cushing (HIC)"]]]}]},{"id":"ps13","s":"ps","t":"Açúcar e ácido","p":"Ana, 19 anos","cc":"Vômitos e respiração de Kussmaul","v":{"pa":"100/62","fc":118,"sat":98,"fr":30,"t":36.9},"d":[["marcos","DM1. Glicemia 480, pH 7,12, bicarbonato 9, potássio 4,0. Insulina já correndo."],["helena","E o potássio?"]],"q":[{"q":"Com K = 4,0, o que fazer com o potássio?","o":["Repor 20–30 mEq de KCl por litro de soro","Não repor: o K está normal","Suspender a insulina até o K passar de 5,5","Repor só quando cair abaixo de 2,5"],"c":[263],"e":"A insulina joga K para dentro da célula. K entre 3,3 e 5,2 → 20–30 mEq/L no soro. K < 3,3 (3,5 no consenso de 2024) → repor antes e adiar a insulina. K > 5,2 → não repor e dosar a cada 2 h.","x":"Sem reposição, o K cai para 2,6 e aparecem extrassístoles.","m":["A insulina é o SEGURANÇA da balada que empurra o potássio para dentro da célula. Se a fila já está curta, ninguém entra até chegar mais gente; se está normal, vai chamando mais 20 a 30 por litro.",[["segurança","insulina joga K para dentro"],["fila curta","K < 3,3 (3,5 em 2024): repõe antes, adia insulina"],["fila normal","K 3,3–5,2: 20–30 mEq por litro"],["fila lotada","K > 5,2: não repõe"]]]}]},{"id":"ps14","s":"ps","t":"Chiado na sala amarela","p":"Pedro, 28 anos","cc":"Crise de asma","v":{"pa":"130/80","fc":116,"sat":91,"fr":28,"t":36.6},"d":[["marcos","Fala frases curtas, sibilo difuso. Quer que eu prepare o quê?"],["helena","Prescreve direito, com dose."]],"q":[{"q":"Prescrição do salbutamol nebulizado:","o":["2,5 mg (até 5 mg) diluídos em 3 mL de SF 0,9%","0,25 mg em 20 mL de SF 0,9%","25 mg em 3 mL de SF 0,9%","2,5 mg diluídos em 3 mL de água destilada"],"c":[317],"e":"Salbutamol nebulizado: 2,5 a 5 mg em 3 mL de SF 0,9%, repetível a cada 20 min na 1ª hora. Água destilada (hipotônica) pode piorar o broncoespasmo.","m":["Uma bombinha de festa com o número 2,5 pintado mergulha em 3 copinhos de SORO. Quem troca por água destilada faz o brônquio fechar de raiva.",[["2,5","salbutamol 2,5 mg (até 5)"],["3 copinhos de soro","3 mL de SF 0,9%"],["água destilada","hipotônica → broncoespasmo"]]]}]},{"id":"ps15","s":"ps","t":"Ossos, pedras e gemidos","p":"Dona Marli, 66 anos","cc":"Sonolência e desidratação","v":{"pa":"102/64","fc":104,"sat":96,"fr":18,"t":36.8},"d":[["marcos","Cálcio 15,2. Creatinina 2,4 (a basal era 0,9)."],["helena","Crise hipercalcêmica. Me descreve o quadro."]],"q":[{"q":"Clínica da crise hipercalcêmica:","o":["Desidratação, IRA pré-renal e rebaixamento do nível de consciência","Tetania, Chvostek e Trousseau","Hiper-reflexia e convulsões focais","Edema agudo de pulmão"],"c":[10],"e":"Hipercalcemia grave: poliúria → desidratação → IRA pré-renal, e rebaixamento até coma. Tetania é hipocalcemia. Tratamento: hidratação vigorosa, depois bisfosfonato/calcitonina.","m":["Uma estátua de GESSO seca no deserto: desidrata, o rim vira pedra seca e a cabeça desliga como estátua.",[["deserto","desidratação (poliúria)"],["rim seco","IRA pré-renal"],["estátua","rebaixamento até coma"],["formigamento, Chvostek","isso é cálcio BAIXO"]]]},{"q":"O PTH veio alto. Como se apresenta a maioria do hiperparatireoidismo primário?","o":["Assintomática (~80%), achada por cálcio alto em exame de rotina","Nefrolitíase em mais de 70% dos casos","Osteíte fibrosa cística como forma mais comum","Crise hipercalcêmica como apresentação típica"],"c":[75],"e":"HPT primário: 80% assintomáticos. Quando dá sintoma: fraqueza/mialgia, nefrolitíase, osteíte fibrosa cística, constipação, poliúria.","m":["Um NINJA paratireoide silencioso: em 80% dos casos ninguém o vê, só o exame de rotina pega o cálcio alto. Quando aparece, atira pedras, quebra ossos e dá dor de barriga.",[["ninja silencioso","80% assintomático"],["pedras","nefrolitíase"],["ossos quebrados","osteíte fibrosa cística"],["barriga","constipação, poliúria"]]]}]},{"id":"ps16","s":"ps","t":"Sódio 118","p":"Sr. Nelson, 72 anos","cc":"Confusão e cefaleia","v":{"pa":"132/78","fc":82,"sat":95,"fr":16,"t":36.6},"d":[["marcos","Tabagista pesado, massa no RX de tórax. Euvolêmico."],["helena","Pensa em SIADH. Primeiro: por que ele está confuso?"]],"q":[{"q":"A clínica das disnatremias é principalmente:","o":["Neurológica: cefaleia, confusão, coma; na HIPERnatremia, hemorragia do SNC","Cardíaca: arritmias ventriculares","Muscular: rabdomiólise isolada","Gastrintestinal: íleo paralítico"],"c":[16],"e":"Hipo e hipernatremia mexem com o volume do neurônio: cefaleia, confusão, convulsão, coma. Na hipernatremia o cérebro encolhe e pode romper vasos (hemorragia).","m":["O neurônio é uma ESPONJA: com pouco sal ela INCHA e entala no crânio; com muito sal ela MURCHA, puxa as veias e elas arrebentam.",[["esponja inchada","hiponatremia: cefaleia, confusão, coma"],["esponja murcha","hipernatremia: hemorragia do SNC"],["os dois","clínica neurológica"]]]},{"q":"Hiponatremia euvolêmica (SIADH), sintomas leves. Tratamento?","o":["Restrição hídrica; se preciso, furosemida (com sal) ou vaptano","SF 0,9% em grande volume","Restrição de sal","Desmopressina"],"c":[252],"e":"SIADH/hipervolêmica: restrição hídrica, furosemida para eliminar água livre, antagonista do ADH (vaptano) ou demeclociclina. SF 0,9% pode piorar o SIADH. Corrigir no máximo 8–10 mEq/L em 24 h.","x":"O SF 0,9% entrou e o sódio caiu para 115.","m":["No banheiro do Sr. Nelson a torneira (ADH) não fecha. O Caio traz mais um balde de SORO. A Dra. Helena fecha o registro, abre o ralo e desliga a bomba.",[["torneira aberta","SIADH"],["registro fechado","restrição hídrica"],["ralo","furosemida (com sal)"],["bomba desligada","vaptano"],["balde de soro","SF 0,9% piora"]]]}]},{"id":"ps17","s":"ps","t":"Apagou ao levantar","p":"Sr. Carlos, 80 anos","cc":"Síncope ao ficar de pé","v":{"pa":"96/58","fc":96,"sat":97,"fr":16,"t":36.4},"d":[["marcos","Começou doxazosina e está com diarreia. A PAS cai 30 em pé."],["helena","Hipotensão ortostática. Por quê?"]],"q":[{"q":"Principais causas de sínco um, menor risco"],["vilão","viloso: maior risco de câncer"]]]},{"q":"Classificação histológica geral dos pólipos colônicos:","o":["Neoplásicos (adenomas, carcinoma) e não neoplásicos (hiperplásico, inflamatório, hamartomatoso)","Todos são neoplásicos","Benignos e malignos apenas pelo tamanho","Sésseis e pediculados"],"c":[322],"e":"Pólipos não neoplásicos: hiperplásicos, inflamatórios (pseudopólipos da DII), hamartomatosos (juvenil, Peutz-Jeghers).","m":["Dois times de pólipos: os NEOPLÁSICOS e 'os outros três'.",[["neoplásicos","adenomas (e carcinoma)"],["os outros três","hiperplásico, inflamatório, hamartomatoso"]]]}]},{"id":"cc13","s":"cc","t":"A fissura fora do lugar","p":"Ricardo, 35 anos","cc":"Fissura anal lateral, indolor e que não cicatriza","v":{"pa":"122/78","fc":72,"sat":99,"fr":14,"t":36.6},"d":[["otavio","Fissura típica é na linha média posterior. Essa não é."]],"q":[{"q":"Diagnósticos diferenciais da fissura atípica:","o":["Crohn, carcinoma epidermoide, herpes/IST, HIV e tuberculose","Só fissura idiopática; tratar com nifedipina","Hemorroida interna","Abscesso isquiorretal"],"c":[177],"e":"Fissura fora da linha média, múltipla, indolor ou refratária → investigar (biópsia, exame sob anestesia): Crohn, câncer, IST, HIV, TB.","m":["Uma fissura que foge da linha média é suspeito fugindo da cena do crime.",[["fora da linha média","investigar"],["suspeitos","Crohn, câncer, IST, HIV, TB"]]]}]},{"id":"cc14","s":"cc","t":"Cisto no pâncreas","p":"Dona Helga, 64 anos","cc":"Lesão cística de 4 cm na cauda do pâncreas","v":{"pa":"126/80","fc":70,"sat":98,"fr":14,"t":36.4},"d":[["otavio","Ecoendoscopia com punção: líquido viscoso, mucina e CEA altos."]],"q":[{"q":"Líquido com mucina e CEA altos sugere:","o":["Neoplasia mucinosa: cistoadenoma mucinoso ou IPMN","Cistoadenoma seroso","Pseudocisto","Tumor sólido-pseudopapilar"],"c":[183],"e":"CEA alto (> 192 ng/mL) = mucinoso: cistoadenoma mucinoso e IPMN (ambos com potencial maligno). Seroso: CEA baixo, aspecto em fav ernando, 50 anos","cc":"DRGE, endoscopia de controle","v":{"pa":"130/80","fc":72,"sat":98,"fr":14,"t":36.5},"d":[["otavio","Laudo da EDA com classificação de Los Angeles. Classifica você."]],"q":[{"q":"Erosões com até 5 mm:","o":["Los Angeles A","Los Angeles B","Los Angeles C","Los Angeles D"],"c":[124],"e":"A: erosões ≤ 5 mm. B: > 5 mm, sem continuidade entre pregas. C: contínuas entre ≥ 2 pregas, < 75% da circunferência. D: ≥ 75%.","m":["Uma FORMIGUINHA de até 5 mm passeando na mucosa do esôfago.",[["até 5 mm","Los Angeles A"]]]},{"q":"Erosão maior que 5 mm, sem continuidade entre pregas:","o":["Los Angeles B","Los Angeles A","Los Angeles C","Los Angeles D"],"c":[125],"e":"B: erosão > 5 mm que não cruza o topo de duas pregas.","m":["Uma LAGARTA maior que 5 mm, mas que não consegue pular de uma prega para outra.",[["> 5 mm","Los Angeles B ('Bigger')"],["não pula prega","não contínua entre pregas"]]]},{"q":"Complicações da DRGE:","o":["Esofagite, úlcera, estenose péptica e esôfago de Barrett","Acalasia e espasmo esofagiano","Divertículo de Zenker","Varizes de esôfago"],"c":[113],"e":"Complicações: esofagite erosiva, úlcera, estenose péptica, Barrett (→ adenocarcinoma).","m":["O ácido desce a escada do esôfago, degrau por degrau, e no último o tapete muda de cor.",[["degraus","esofagite → úlcera → estenose péptica"],["tapete muda de cor","esôfago de Barrett"]]]}]},{"id":"cc18","s":"cc","t":"Massa no mediastino","p":"Ambulatório de cirurgia torácica","cc":"Achados de imagem","v":{"pa":"122/76","fc":74,"sat":98,"fr":14,"t":36.5},"d":[["otavio","Um cisto no mediastino e um derrame com células malignas. Vamos por partes."]],"q":[{"q":"Cistos broncogênico e pericárdico ficam em qual compartimento?","o":["Médio","Anterior","Posterior","Superior exclusivamente"],"c":[53],"e":"Anterior: 4 T (timoma, teratoma, tireoide, \"terrível\" linfoma). Médio: cistos (broncogênico, pericárdico), linfonodos. Posterior: tumores neurogênicos.","m":["No prédio do mediastino, os CISTOS moram 4: cesárea"]]]},{"q":"Na sala ao lado, após bloqueio com muito volume de anestésico local: dormência perioral, zumbido, tontura e depois arritmia. O que é?","o":["Intoxicação sistêmica por anestésico local (tratar com emulsão lipídica 20%)","Raquianestesia total","Reação vasovagal","Anafilaxia ao látex"],"c":[248],"e":"Toxicidade sistêmica: primeiro sinais neurológicos (perioral, zumbido, gosto metálico, convulsão), depois cardiovasculares (arritmia, colapso). Emulsão lipídica a 20%.","x":"Você chamou de vasovagal e deu atropina: ela convulsiona e entra em TV.","m":["O anestésico sobe pelo corpo como água num prédio: no 1º andar a boca formiga e o ouvido zumbe, no meio do prédio vem a convulsão, na cobertura o coração para. O bombeiro joga GORDURA.",[["boca e ouvido","sinais neurológicos primeiro"],["cobertura","arritmia, colapso"],["gordura","emulsão lipídica a 20%"]]]}]},{"id":"cc22","s":"cc","t":"Sala de trauma","p":"Vítima de colisão, 40 anos","cc":"Avaliação primária","v":{"pa":"98/60","fc":122,"sat":94,"fr":28,"t":35.9},"d":[["otavio","ABCDE rolando. Quais monitorizações e adjuntos você coloca agora?"]],"q":[{"q":"Adjuntos da avaliação primária:","o":["FR, capnografia, oximetria, ECG, PA, temperatura, sondas gástrica e vesical (+ gasometria, RX, eFAST)","TC de corpo inteiro antes de abordar a via aérea","Só PA e FC","Lactato e glicemia no lugar da oximetria"],"c":[223],"e":"ATLS: monitorização (ECG, SpO2, CO2 exalado, PA, FR, temperatura), gasometria, sondas, RX de tórax/pelve e eFAST. TC só com paciente estável, na secundária.","m":["Na sala de trauma o paciente vira uma árvore de Natal: fios piscando, mangueiras penduradas e fotos tiradas.",[["fios","ECG, oximetria, capnografia, PA, FR, temperatura"],["mangueiras","sondas gástrica e vesical"],["fotos","RX de tórax e pelve, eFAST"]]]}]},{"id":"cc23","s":"cc","t":"Fumaça","p":"Seu Lourival, 61 anos","cc":"Resgatado de incêndio em ambiente fechado","v":{"pa":"90/56","fc":124,"sat":97,"fr":32,"t":36.6},"d":[["otavio","Comatoso, lactato 12, saturação \"boa\" no oxímetro."]],"q":[{"q":"Intoxicação por cianeto: como pensar no diagnóstico?","o":["História compatível + coma, insuficiência respiratória e acidose lática grave de evolução rápida (antídoto: hidroxocobalamina)","Carboxi-hemoglobina normal descarta","Cianose central intensa é obrigatória","Só com dosagem sérica de cianeto em mãos"],"c":[249],"e":"Cianeto bloqueia a citocromo-oxidase: acidose lática importante, coma, sem cianose (sangue venoso arterializado). Não espere a dosagem: hidroxocobalamina.","m":["O oxímetro mostra 99% e o paciente está morrendo: o oxigênio chega, mas o CIANETO tranca a porta da mitocôndria. O lactato explode.",[["99% morrendo","saturação enganosa"],["lactato altíssimo","acidose lática grave"],["chave da porta","hidroxocobalamina"]]]}]},{"id":"cc24","s":"cc","t":"Quadris","p":"Ortopedia de plantão","cc":"Dois pacientes com dor no quadril","v":{"pa":"140/82","fc":92,"sat":97,"fr":18,"t":36.4},"d":[["otavio","Idosa caiu da própria altura. Rapaz bateu o joelho no painel do carro."]],"q":[{"q":"Idosa, fratura do fêmur proximal. Como fica o membro?","o":["Encurtado e em rotação externa","Encurtado, aduzido e em rotação interna","Alongado e em abdução","Sem deformidade, como regra"],"c":[17,320],"e":"Fratura do colo/transtrocantérica: dor no quadril, encurtamento e rotação externa.","m":["A vovó cai e a perna fica CURTA, com o pé deitado para FORA como pé de pato.",[["curta + pé para fora","fratura do fêmur proximal (encurtamento + rotação externa)"]]]},{"q":"Rapaz com luxação POSTERIOR do quadril (joelho no painel). Postura?","o":["Flexão, adução e rotação interna","Abdução e rotação externa","Extensão e rotação externa","Membro alongado em abdução"],"c":[58],"e":"Luxação posterior (90%): flexão, adução, rotação interna, encurtamento; risco de lesão do ciático. Anterior: abdução e rotação externa.","m":["O motorista bate o joelho no painel e o quadril fica envergonhado: perna dobrada, fechada e co
